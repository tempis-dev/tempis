<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Menu</title>
  <script src="../lib/tempis_timeline.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    h1 {
      font-size: 1.6em;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 20px;
    }

    .canvas-container {
      width: 100%;
      height: 500px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Context menu */
    .ctx-menu {
      position: fixed;
      z-index: 9999;
      min-width: 180px;
      background: #252540;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 4px 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      display: none;
    }

    .ctx-menu.open { display: block; }

    .ctx-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      font-size: 0.88em;
      color: #d0d0d0;
      cursor: pointer;
      transition: background 0.12s;
    }

    .ctx-menu-item:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .ctx-menu-item.danger { color: #f87171; }
    .ctx-menu-item.danger:hover { background: rgba(248,113,113,0.12); }

    .ctx-menu-sep {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 4px 0;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #252540;
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85em;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 10000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <h1>Context Menu</h1>
  <p class="subtitle">Right-click any item to open a custom context menu with actions.</p>

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Context menu element -->
  <div class="ctx-menu" id="ctx-menu">
    <div class="ctx-menu-item" data-action="edit">✏️ Edit Item</div>
    <div class="ctx-menu-item" data-action="duplicate">📋 Duplicate</div>
    <div class="ctx-menu-item" data-action="info">ℹ️ View Details</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item danger" data-action="delete">🗑️ Delete Item</div>
  </div>

  <!-- Toast element -->
  <div class="toast" id="toast"></div>
</body>
<script>
  (function () {
    // ── State ──
    var nextId = 100;
    var contextItemId = null;
    var menuEl = document.getElementById('ctx-menu');
    var toastEl = document.getElementById('toast');
    var toastTimer = null;

    // ── Items ──
    var items = [
      { id: 1, label: 'Research',       start: '2026-03-01', end: '2026-03-08', grouping: 'Planning' },
      { id: 2, label: 'Requirements',   start: '2026-03-06', end: '2026-03-14', grouping: 'Planning' },
      { id: 3, label: 'Wireframes',     start: '2026-03-10', end: '2026-03-18', grouping: 'Design' },
      { id: 4, label: 'Prototyping',    start: '2026-03-16', end: '2026-03-25', grouping: 'Design' },
      { id: 5, label: 'Frontend',       start: '2026-03-20', end: '2026-04-05', grouping: 'Development' },
      { id: 6, label: 'Backend',        start: '2026-03-22', end: '2026-04-08', grouping: 'Development' },
      { id: 7, label: 'API Integration',start: '2026-04-01', end: '2026-04-10', grouping: 'Development' },
      { id: 8, label: 'QA Testing',     start: '2026-04-06', end: '2026-04-15', grouping: 'Testing' },
      { id: 9, label: 'UAT',            start: '2026-04-12', end: '2026-04-18', grouping: 'Testing' },
      { id: 10, label: 'Launch',        start: '2026-04-18', end: '2026-04-20', grouping: 'Release' },
    ];

    // ── Timeline ──
    var tl = new tempis_timeline.TempisTimeline('#canvas', {
      responsive: true,
      verticalFill: 'fill-canvas',
      style: { item: { borderRadius: 4, fontColor: '#fff' } },
      range: { start: '2026-02-22', end: '2026-04-26', position: 'bottom' },
      items: items,

      onItemContextClick: function (id, position) {
        contextItemId = id;
        showMenu(position.x, position.y);
      },

      onItemClick: function () {
        closeMenu();
      }
    });

    // ── Menu helpers ──
    function showMenu(x, y) {
      // Keep menu within viewport bounds.
      var rect = menuEl.getBoundingClientRect();
      menuEl.classList.add('open');
      var mw = menuEl.offsetWidth;
      var mh = menuEl.offsetHeight;
      if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
      if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
      menuEl.style.left = x + 'px';
      menuEl.style.top = y + 'px';
    }

    function closeMenu() {
      menuEl.classList.remove('open');
      contextItemId = null;
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
    }

    function findItem(id) {
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) return items[i];
      }
      return null;
    }

    // ── Menu actions ──
    menuEl.addEventListener('click', function (e) {
      var target = e.target.closest('.ctx-menu-item');
      if (!target || contextItemId === null) return;

      var action = target.getAttribute('data-action');
      var item = findItem(contextItemId);

      if (action === 'delete' && item) {
        items = items.filter(function (i) { return i.id !== contextItemId; });
        tl.setItems(items);
        toast('Deleted "' + item.label + '"');
      }

      if (action === 'duplicate' && item) {
        var clone = {};
        for (var k in item) clone[k] = item[k];
        clone.id = nextId++;
        clone.label = item.label + ' (copy)';
        items.push(clone);
        tl.setItems(items);
        toast('Duplicated "' + item.label + '"');
      }

      if (action === 'edit' && item) {
        var newLabel = prompt('Rename item:', item.label);
        if (newLabel && newLabel.trim()) {
          item.label = newLabel.trim();
          tl.setItems(items);
          toast('Renamed to "' + item.label + '"');
        }
      }

      if (action === 'info' && item) {
        var start = new Date(item.start).toLocaleDateString();
        var end = item.end ? new Date(item.end).toLocaleDateString() : '—';
        toast(item.label + '  ·  ' + start + ' → ' + end + '  ·  ' + (item.grouping || 'No group'));
      }

      closeMenu();
    });

    // Close menu on outside click or scroll.
    document.addEventListener('mousedown', function (e) {
      if (!menuEl.contains(e.target)) closeMenu();
    });
    document.addEventListener('wheel', function () { closeMenu(); }, { passive: true });
  })();
</script>
</html>
