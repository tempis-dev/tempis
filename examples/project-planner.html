<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Planner | Tempis Timeline</title>
  <script src="../lib/tempis_timeline.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --border: #e7e9f0;
      --border-soft: #eef0f5;
      --text: #1a1a2e;
      --text-2: #5b6474;
      --text-3: #9299a8;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: Geist, system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px;
      display: flex; flex-direction: column; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top bar */
    .topbar {
      flex: 0 0 auto; background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .brand .logo {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, #4f46e5, #7c6cf6);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
    }
    .brand .sub { font-weight: 400; font-size: 12px; color: var(--text-3); padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--border); }
    .topbar .spacer { flex: 1; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button {
      font-family: inherit; font-size: 12px; font-weight: 500; padding: 6px 14px;
      background: var(--card); color: var(--text-2); border: none; cursor: pointer; border-right: 1px solid var(--border);
    }
    .seg button:last-child { border-right: none; }
    .seg button:hover { background: var(--bg); color: var(--text); }
    .seg button.active { background: var(--primary); color: #fff; }
    .topbar .ctrl { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
    .topbar select {
      font-family: inherit; font-size: 12px; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; outline: none;
    }
    .topbar select:focus { border-color: var(--primary); }

    /* Workspace */
    .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }

    /* Task tree */
    .tree { background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; min-height: 0; }
    .tree-head {
      padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-3); border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0; background: var(--card); z-index: 1;
    }
    .phase { border-bottom: 1px solid var(--border-soft); }
    .phase-head {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer;
      font-weight: 600; font-size: 13px; user-select: none;
    }
    .phase-head:hover { background: var(--bg); }
    .phase-head .chevron { width: 10px; transition: transform 0.15s; color: var(--text-3); font-size: 10px; }
    .phase-head.collapsed .chevron { transform: rotate(-90deg); }
    .phase-head .swatch { width: 9px; height: 9px; border-radius: 3px; }
    .phase-head .pname { flex: 1; }
    .phase-head .count { font-size: 11px; color: var(--text-3); font-weight: 400; }
    .phase-add {
      border: none; background: none; cursor: pointer; color: var(--text-3); font-size: 16px; line-height: 1;
      padding: 0 6px; border-radius: 5px; opacity: 0; transition: opacity 0.12s, color 0.12s, background 0.12s;
    }
    .phase-head:hover .phase-add { opacity: 1; }
    .phase-add:hover { color: var(--primary); background: var(--primary-soft); }
    .phase-tasks.collapsed { display: none; }
    .task-row {
      display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 32px; cursor: pointer;
      font-size: 13px; color: var(--text-2); border-left: 2px solid transparent;
    }
    .task-row:hover { background: var(--bg); }
    .task-row.selected { background: var(--primary-soft); border-left-color: var(--primary); color: var(--text); font-weight: 500; }
    .task-row .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-row .tnote { font-size: 11px; line-height: 1; opacity: 0.85; }
    .task-row .tpct { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--text-3); }

    /* Bands panel */
    .tree-head.bands-head { display: flex; align-items: center; gap: 8px; position: static; }
    .bands-head span { flex: 1; }
    .band-add-btn {
      font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none;
      color: var(--primary); background: var(--primary-soft); border: none; border-radius: 6px;
      padding: 4px 9px; cursor: pointer;
    }
    .band-add-btn:hover { background: #e3e8ff; }
    .bands-body { padding: 4px 14px 18px; }
    .bands-empty { font-size: 12px; color: var(--text-3); line-height: 1.5; padding: 4px 0; }
    .band-row { padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
    .band-row:last-child { border-bottom: none; }
    .band-top { display: flex; align-items: center; gap: 8px; }
    .band-dot { width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; border: none; cursor: pointer; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }
    .band-dot:hover { box-shadow: 0 0 0 2px var(--primary-soft); }
    .band-swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-left: 17px; }
    .swatch-opt { width: 20px; height: 20px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }
    .swatch-opt:hover { transform: scale(1.08); }
    .swatch-opt.active { border-color: var(--text); }
    .band-label {
      flex: 1; min-width: 0; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text);
      background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; outline: none;
    }
    .band-label:hover { border-color: var(--border); }
    .band-label:focus { border-color: var(--primary); background: var(--card); }
    .band-remove { border: none; background: none; cursor: pointer; color: var(--text-3); font-size: 16px; line-height: 1; padding: 0 3px; }
    .band-remove:hover { color: #ef4444; }
    .band-dates { display: flex; align-items: center; gap: 6px; margin-top: 7px; padding-left: 17px; }
    .band-dates input[type="date"] {
      flex: 1; min-width: 0; font-family: inherit; font-size: 11.5px; color: var(--text-2); background: var(--card);
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; outline: none;
    }
    .band-dates input[type="date"]:focus { border-color: var(--primary); }
    .band-to { font-size: 11px; color: var(--text-3); flex: 0 0 auto; }

    /* Main / timeline */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .main-head {
      flex: 0 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); background: var(--card);
    }
    .main-head h2 { font-size: 14px; font-weight: 600; }
    .main-head .hint { font-size: 12px; color: var(--text-3); }
    .main-head .spacer { flex: 1; }
    .toggle {
      display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2);
      cursor: pointer; user-select: none;
    }
    .toggle input { accent-color: var(--primary); }
    .timeline-host { flex: 1; min-height: 0; position: relative; }
    .timeline-host canvas { display: block; width: 100%; height: 100%; }

    /* Detail drawer */
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: calc(100vw - 20px);
      background: var(--card); border-left: 1px solid var(--border); box-shadow: -8px 0 32px rgba(20,20,45,0.1);
      transform: translateX(100%); transition: transform 0.22s ease; z-index: 50; display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 18px 20px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: flex-start; gap: 10px; }
    .drawer-head .cat-dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; flex: 0 0 auto; }
    .drawer-head h3 { font-size: 15px; font-weight: 600; line-height: 1.3; }
    .drawer-head .phase-name { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .drawer-head .x { margin-left: auto; cursor: pointer; border: none; background: none; color: var(--text-3); font-size: 20px; line-height: 1; }
    .drawer-head .x:hover { color: var(--text); }
    .drawer-body { padding: 18px 20px; overflow-y: auto; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); margin-bottom: 5px; }
    .field .val { font-size: 14px; font-family: "Geist Mono", monospace; }
    .progress-track { height: 8px; border-radius: 5px; background: var(--bg); overflow: hidden; margin-top: 4px; }
    .progress-fill { height: 100%; border-radius: 5px; background: var(--primary); transition: width 0.3s; }
    .range-input { width: 100%; accent-color: var(--primary); margin-top: 6px; }
    .size-row { display: flex; gap: 10px; }
    .size-row .field { flex: 1; min-width: 0; }
    .field input[type="date"] {
      width: 100%; font-family: inherit; font-size: 13px; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; outline: none;
    }
    .field input[type="date"]:focus { border-color: var(--primary); }
    .deps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .deps-empty { font-size: 12px; color: var(--text-3); }
    .dep-chip {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2);
      background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px; padding: 5px 6px 5px 9px;
    }
    .dep-chip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dep-remove { border: none; background: none; cursor: pointer; color: var(--text-3); font-size: 16px; line-height: 1; padding: 0 3px; }
    .dep-remove:hover { color: #ef4444; }
    .dep-add {
      width: 100%; font-family: inherit; font-size: 13px; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; cursor: pointer; outline: none;
    }
    .dep-add:focus { border-color: var(--primary); }
    .danger-btn {
      width: 100%; margin-top: 4px; font-family: inherit; font-size: 13px; font-weight: 500;
      color: #dc2626; background: #fff; border: 1px solid #f3c6c6; border-radius: 8px; padding: 9px; cursor: pointer;
    }
    .danger-btn:hover { background: #fef2f2; border-color: #ef4444; }
    .note-input {
      width: 100%; min-height: 84px; resize: vertical; font-family: inherit; font-size: 13px;
      line-height: 1.5; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; outline: none;
    }
    .note-input:focus { border-color: var(--primary); }
    .note-input::placeholder { color: var(--text-3); }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #d6dae3; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #c2c8d4; }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
      .tree { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◪</span>
      <span>Orbit Planner</span>
      <span class="sub">Mobile App Launch</span>
    </div>
    <div class="spacer"></div>
    <div class="ctrl">
      <span>Assignee</span>
      <select id="assigneeFilter">
        <option value="all">Everyone</option>
      </select>
    </div>
    <div class="seg" id="zoomSeg">
      <button data-zoom="month" class="active">Month</button>
      <button data-zoom="quarter">Quarter</button>
      <button data-zoom="all">All</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Task tree + bands -->
    <aside class="tree">
      <div class="tree-head">Phases &amp; Tasks</div>
      <div id="treeBody"></div>

      <div class="tree-head bands-head">
        <span>Schedule bands</span>
        <button class="band-add-btn" id="addBandBtn" title="Add band">+ Add</button>
      </div>
      <div id="bandsBody" class="bands-body"></div>
    </aside>

    <!-- Timeline -->
    <main class="main">
      <div class="main-head">
        <h2>Schedule</h2>
        <span class="hint">Select a task to edit dates, dependencies and notes. Add tasks from the tree, bands from the panel below it.</span>
        <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="showDeps" checked> Dependencies</label>
      </div>
      <div class="timeline-host"><canvas id="timeline"></canvas></div>
    </main>
  </div>

  <!-- Detail drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <span class="cat-dot" id="dCat"></span>
      <div>
        <h3 id="dName"></h3>
        <div class="phase-name" id="dPhase"></div>
      </div>
      <button class="x" id="dClose" aria-label="Close">×</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
  </div>

<script>
(function () {
  var TT = tempis_timeline.TempisTimeline;

  // ── Phases (groups) ──
  var phases = [
    { name: 'Planning',    color: '#6366f1' },
    { name: 'Design',      color: '#ec4899' },
    { name: 'Development',  color: '#0ea5e9' },
    { name: 'QA',          color: '#f59e0b' },
    { name: 'Release',     color: '#10b981' }
  ];
  var phaseByName = {};
  phases.forEach(function (p) { phaseByName[p.name] = p; });

  var assignees = ['Ava Chen', 'Marcus Lee', 'Priya Nair', 'Tom Rivera', 'Sofia Berg'];

  // ── Tasks ──
  var tasks = [
    { id: 1,  name: 'Market research',       phase: 'Planning',    start: '2026-02-02', end: '2026-02-13', progress: 1.0,  assignee: 'Ava Chen', note: 'Focus groups done. Report shared in the Planning channel.' },
    { id: 2,  name: 'Requirements spec',      phase: 'Planning',    start: '2026-02-10', end: '2026-02-24', progress: 1.0,  assignee: 'Marcus Lee' },
    { id: 3,  name: 'Project kickoff',        phase: 'Planning',    start: '2026-02-25', progress: 1.0,  assignee: 'Ava Chen' },

    { id: 10, name: 'Wireframes',             phase: 'Design',      start: '2026-02-23', end: '2026-03-09', progress: 1.0,  assignee: 'Priya Nair' },
    { id: 11, name: 'Visual design',          phase: 'Design',      start: '2026-03-06', end: '2026-03-24', progress: 0.85, assignee: 'Priya Nair', note: 'Waiting on final brand palette before locking the component library.' },
    { id: 12, name: 'Design review',          phase: 'Design',      start: '2026-03-23', end: '2026-03-27', progress: 0.5,  assignee: 'Marcus Lee' },

    { id: 20, name: 'API & data layer',       phase: 'Development', start: '2026-03-16', end: '2026-04-10', progress: 0.7,  assignee: 'Tom Rivera' },
    { id: 21, name: 'Auth & onboarding',      phase: 'Development', start: '2026-03-30', end: '2026-04-17', progress: 0.45, assignee: 'Tom Rivera' },
    { id: 22, name: 'Core screens',           phase: 'Development', start: '2026-04-06', end: '2026-05-01', progress: 0.3,  assignee: 'Sofia Berg', note: 'Blocked on the design review. Stubbing screens with mock data for now.' },
    { id: 23, name: 'Push notifications',     phase: 'Development', start: '2026-04-27', end: '2026-05-11', progress: 0.0,  assignee: 'Sofia Berg' },

    { id: 30, name: 'Integration testing',    phase: 'QA',          start: '2026-05-04', end: '2026-05-18', progress: 0.0,  assignee: 'Marcus Lee' },
    { id: 31, name: 'Beta program',           phase: 'QA',          start: '2026-05-14', end: '2026-05-29', progress: 0.0,  assignee: 'Ava Chen' },
    { id: 32, name: 'Bug fix sprint',         phase: 'QA',          start: '2026-05-25', end: '2026-06-05', progress: 0.0,  assignee: 'Tom Rivera' },

    { id: 40, name: 'Store submission',       phase: 'Release',     start: '2026-06-08', end: '2026-06-12', progress: 0.0,  assignee: 'Marcus Lee' },
    { id: 41, name: 'Launch',                 phase: 'Release',     start: '2026-06-15', progress: 0.0,  assignee: 'Ava Chen' }
  ];
  var taskById = {};
  tasks.forEach(function (t) { taskById[t.id] = t; });

  // ── Dependencies (finish-to-start) ──
  // A trimmed set of key hand-offs. We keep the arrows whose source finishes before
  // the target starts, so lines don't have to loop back across overlapping bars.
  var deps = [
    { source: 2, target: 3 },     // Requirements spec -> Project kickoff
    { source: 3, target: 10 },    // Kickoff -> Wireframes
    { source: 10, target: 11 },   // Wireframes -> Visual design
    { source: 12, target: 22 },   // Design review -> Core screens
    { source: 22, target: 30 },   // Core screens -> Integration testing
    { source: 30, target: 31 },   // Integration testing -> Beta program
    { source: 32, target: 40 },   // Bug fix sprint -> Store submission
    { source: 40, target: 41 }    // Store submission -> Launch
  ];

  var FONT = "Geist, system-ui, -apple-system, Roboto, sans-serif";
  var assigneeFilter = 'all';
  var selectedId = null;

  // Next ids for user-created tasks and bands (task ids start high to avoid clashes).
  var nextTaskId = 1000;
  var nextBandId = 1;

  // Soft background colours used for user-added bands, cycled as they are created.
  var BAND_COLORS = ['#4f46e5', '#ec4899', '#0ea5e9', '#f59e0b', '#10b981', '#ef4444', '#64748b'];

  // User-managed schedule bands. The "today" marker is always rendered in addition.
  var userBands = [
    { id: nextBandId++, label: 'Design freeze', start: '2026-03-20', end: '2026-03-27', color: '#ec4899' },
    { id: nextBandId++, label: 'Release window', start: '2026-06-08', end: '2026-06-15', color: '#10b981' }
  ];

  // Build the full band list for the timeline: the fixed "today" marker plus every
  // user band. Bands need a start and end to render as a shaded window.
  function buildBands() {
    var bands = [
      { start: '2026-04-06', style: { color: '#4f46e5', borderColor: '#4f46e5', borderThickness: 1, opacity: 0.08 } }
    ];
    userBands.forEach(function (b) {
      if (!b.start || !b.end) return;
      bands.push({ start: b.start, end: b.end, style: { color: b.color, opacity: 0.1 } });
    });
    return bands;
  }

  // A task has a note when its note string is non-empty.
  function hasNote(t) { return !!(t.note && t.note.trim()); }

  // Build a timeline item from a task, honouring the current assignee filter. When a
  // note is stored against the task, a small note glyph is appended to the label.
  function toItem(t) {
    // The "__none__" filter matches tasks with no assignee; otherwise match by name.
    var matches = assigneeFilter === 'all' ||
      (assigneeFilter === '__none__' ? !t.assignee : t.assignee === assigneeFilter);
    var dimmed = !matches;
    return {
      id: t.id,
      label: t.name + (hasNote(t) ? '  \uD83D\uDCDD' : ''),
      start: t.start,
      end: t.end,
      grouping: t.phase,
      category: t.phase,
      progress: t.end ? t.progress : undefined,
      style: dimmed ? { backgroundColor: '#d8dbe4', fontColor: '#8a90a0' } : undefined
    };
  }

  function buildItems() { return tasks.map(toItem); }

  // Rebuild the timeline items and keep the current selection highlighted. Calling
  // setItems rebuilds the dataset and drops the selection, so we re-apply it here
  // whenever an edit in the drawer changes an item while it stays selected.
  function refreshItems() {
    timeline.setItems(buildItems());
    if (selectedId != null && taskById[selectedId]) timeline.setSelection([selectedId]);
  }

  var timeline = new TT('#timeline', {
    responsive: true,
    verticalFill: 'fill-canvas',
    selection: 'single',
    stackMode: 'stable',
    style: {
      font: { family: FONT, size: 13 },
      item: { borderRadius: 5, fontColor: '#fff', padding: 8 }
    },
    categories: phases.map(function (p) {
      return { name: p.name, label: p.name, style: { backgroundColor: p.color, fontColor: '#fff' } };
    }),
    grouping: { collapsible: true },
    legend: { position: 'bottom', markerStyle: 'circle' },
    range: { start: '2026-02-01', end: '2026-04-15', position: 'bottom', zoom: { enabled: true } },
    bands: buildBands(),
    items: buildItems(),
    dependencies: deps,
    tooltip: {
      overflowBehavior: 'viewport',
      template: function (id) {
        var t = taskById[id];
        if (!t) return null;
        var pct = Math.round(t.progress * 100);
        var noteBlock = hasNote(t)
          ? '<div style="display:flex;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid #eef0f5;font-size:12px;color:#5b6474;line-height:1.45;">' +
              '<span style="flex:0 0 auto;">\uD83D\uDCDD</span><span>' + escapeHtml(t.note) + '</span></div>'
          : '';
        return '<div style="padding:11px 14px;font-family:' + FONT + ';font-size:13px;min-width:190px;max-width:260px;background:#fff;color:#1a1a2e;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);">' +
          '<div style="font-weight:600;margin-bottom:6px;">' + t.name + '</div>' +
          '<div style="display:flex;justify-content:space-between;color:#5b6474;font-size:12px;margin-bottom:6px;"><span>' + t.phase + '</span><span>' + (t.assignee || 'Unassigned') + '</span></div>' +
          '<div style="height:6px;border-radius:4px;background:#eef0f5;overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:' + phaseByName[t.phase].color + ';"></div></div>' +
          '<div style="font-size:11px;color:#9299a8;margin-top:4px;">' + pct + '% complete</div>' +
          noteBlock +
        '</div>';
      }
    },
    onSelectionChange: function (changes) {
      var sel = changes.find(function (c) { return c.selected; });
      if (sel) { selectItem(sel.id); } else { closeDrawer(); }
      timeline.setSelection(sel ? [sel.id] : []);
    },
    onGroupToggle: function (group, collapsed) {
      // Keep the tree's collapse state in sync with the timeline.
      var head = document.querySelector('.phase-head[data-phase="' + CSS.escape(group) + '"]');
      if (head) {
        head.classList.toggle('collapsed', collapsed);
        head.nextElementSibling.classList.toggle('collapsed', collapsed);
      }
    }
  });

  // ── Task tree ──
  var treeBody = document.getElementById('treeBody');
  function buildTree() {
    treeBody.innerHTML = '';
    phases.forEach(function (p) {
      var group = tasks.filter(function (t) { return t.phase === p.name; });

      var phaseEl = document.createElement('div');
      phaseEl.className = 'phase';

      var head = document.createElement('div');
      head.className = 'phase-head';
      head.dataset.phase = p.name;
      head.innerHTML = '<span class="chevron">▾</span><span class="swatch" style="background:' + p.color + '"></span>' +
        '<span class="pname">' + p.name + '</span>' +
        '<button class="phase-add" title="Add task to ' + p.name + '">+</button>' +
        '<span class="count">' + group.length + '</span>';
      head.querySelector('.phase-add').addEventListener('click', function (ev) {
        ev.stopPropagation();
        addTask(p.name);
      });

      var list = document.createElement('div');
      list.className = 'phase-tasks';

      group.forEach(function (t) {
        var row = document.createElement('div');
        row.className = 'task-row';
        row.dataset.id = t.id;
        row.innerHTML = '<span class="tname">' + t.name + '</span>' +
          '<span class="tnote" title="Has a note"' + (hasNote(t) ? '' : ' style="display:none"') + '>\uD83D\uDCDD</span>' +
          '<span class="tpct">' + Math.round(t.progress * 100) + '%</span>';
        row.addEventListener('click', function () {
          timeline.setSelection([t.id]);
          timeline.focus({ id: t.id, animate: true, duration: 450 });
          selectItem(t.id);
        });
        list.appendChild(row);
      });

      head.addEventListener('click', function () {
        var collapsed = !head.classList.contains('collapsed');
        head.classList.toggle('collapsed', collapsed);
        list.classList.toggle('collapsed', collapsed);
        timeline.setGroupCollapsed(p.name, collapsed);
      });

      phaseEl.appendChild(head);
      phaseEl.appendChild(list);
      treeBody.appendChild(phaseEl);
    });
    highlightTreeRow();
  }

  // ── Bands panel ──
  var bandsBody = document.getElementById('bandsBody');
  function buildBandsPanel() {
    bandsBody.innerHTML = '';
    if (!userBands.length) {
      bandsBody.innerHTML = '<div class="bands-empty">No bands yet. Add one to shade a window on the schedule.</div>';
      return;
    }
    userBands.forEach(function (b) {
      var row = document.createElement('div');
      row.className = 'band-row';
      var swatches = BAND_COLORS.map(function (c) {
        return '<button class="swatch-opt' + (c === b.color ? ' active' : '') + '" data-color="' + c + '" style="background:' + c + '" title="' + c + '"></button>';
      }).join('');
      row.innerHTML =
        '<div class="band-top">' +
          '<button class="band-dot" style="background:' + b.color + '" title="Change colour"></button>' +
          '<input class="band-label" value="' + escapeHtml(b.label) + '">' +
          '<button class="band-remove" title="Remove band">×</button>' +
        '</div>' +
        '<div class="band-swatches" hidden>' + swatches + '</div>' +
        '<div class="band-dates">' +
          '<input type="date" class="band-start" value="' + toDateValue(b.start) + '">' +
          '<span class="band-to">to</span>' +
          '<input type="date" class="band-end" value="' + toDateValue(b.end) + '">' +
        '</div>';

      // Toggle the colour swatch row from the band's colour dot.
      var dot = row.querySelector('.band-dot');
      var swatchRow = row.querySelector('.band-swatches');
      dot.addEventListener('click', function () { swatchRow.hidden = !swatchRow.hidden; });
      Array.prototype.forEach.call(row.querySelectorAll('.swatch-opt'), function (sw) {
        sw.addEventListener('click', function () {
          b.color = sw.dataset.color;
          dot.style.background = b.color;
          Array.prototype.forEach.call(row.querySelectorAll('.swatch-opt'), function (o) { o.classList.toggle('active', o === sw); });
          swatchRow.hidden = true;
          timeline.setBands(buildBands());
        });
      });

      row.querySelector('.band-label').addEventListener('input', function (e) { b.label = e.target.value; });
      row.querySelector('.band-start').addEventListener('change', function (e) {
        b.start = e.target.value;
        if (b.end && b.start && new Date(b.end) < new Date(b.start)) { b.end = b.start; row.querySelector('.band-end').value = toDateValue(b.end); }
        timeline.setBands(buildBands());
      });
      row.querySelector('.band-end').addEventListener('change', function (e) {
        b.end = e.target.value;
        if (b.end && b.start && new Date(b.end) < new Date(b.start)) { b.start = b.end; row.querySelector('.band-start').value = toDateValue(b.start); }
        timeline.setBands(buildBands());
      });
      row.querySelector('.band-remove').addEventListener('click', function () {
        userBands = userBands.filter(function (x) { return x !== b; });
        timeline.setBands(buildBands());
        buildBandsPanel();
      });

      bandsBody.appendChild(row);
    });
  }

  document.getElementById('addBandBtn').addEventListener('click', function () {
    var color = BAND_COLORS[(nextBandId - 1) % BAND_COLORS.length];
    userBands.push({ id: nextBandId++, label: 'New band', start: '2026-04-06', end: '2026-04-20', color: color });
    timeline.setBands(buildBands());
    buildBandsPanel();
  });

  // Show or hide the note glyph on a tree row to match the task's note state.
  function updateTreeNote(id) {
    var t = taskById[id];
    var row = treeBody.querySelector('.task-row[data-id="' + id + '"] .tnote');
    if (row) row.style.display = hasNote(t) ? '' : 'none';
  }

  function highlightTreeRow() {
    document.querySelectorAll('.task-row.selected').forEach(function (r) { r.classList.remove('selected'); });
    if (selectedId != null) {
      var row = treeBody.querySelector('.task-row[data-id="' + selectedId + '"]');
      if (row) row.classList.add('selected');
    }
  }

  // ── Detail drawer ──
  var drawer = document.getElementById('drawer');
  function selectItem(id) {
    var t = taskById[id];
    if (!t) return;
    selectedId = id;
    var p = phaseByName[t.phase];

    document.getElementById('dCat').style.background = p.color;
    document.getElementById('dName').textContent = t.name;
    document.getElementById('dPhase').textContent = t.phase;

    var pct = Math.round(t.progress * 100);

    // Incoming dependencies (tasks this one depends on).
    var incoming = deps.filter(function (d) { return d.target === id; });
    var depRows = incoming.map(function (d) {
      return '<div class="dep-chip" data-src="' + d.source + '"><span>' + escapeHtml(taskById[d.source].name) +
        '</span><button class="dep-remove" data-src="' + d.source + '" title="Remove dependency">×</button></div>';
    }).join('');

    // Tasks that can still be added as a dependency (not self, not already linked).
    var linked = {}; incoming.forEach(function (d) { linked[d.source] = true; });
    var depOptions = tasks.filter(function (o) { return o.id !== id && !linked[o.id]; })
      .map(function (o) { return '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>'; }).join('');

    var assigneeOpts = '<option value=""' + (!t.assignee ? ' selected' : '') + '>Unassigned</option>' +
      assignees.map(function (a) { return '<option value="' + escapeHtml(a) + '"' + (a === t.assignee ? ' selected' : '') + '>' + escapeHtml(a) + '</option>'; }).join('');

    document.getElementById('dBody').innerHTML =
      '<div class="field"><label>Assignee</label><select id="dAssignee" class="dep-add">' + assigneeOpts + '</select></div>' +
      '<div class="size-row">' +
        '<div class="field"><label>Start</label><input type="date" id="dStart" value="' + toDateValue(t.start) + '"></div>' +
        '<div class="field"><label>End</label><input type="date" id="dEnd" value="' + toDateValue(t.end) + '"></div>' +
      '</div>' +
      '<div class="field"><label id="dProgLabel">Progress ' + pct + '%</label>' +
        '<div class="progress-track"><div class="progress-fill" id="dFill" style="width:' + pct + '%;background:' + p.color + '"></div></div>' +
        '<input class="range-input" type="range" min="0" max="100" value="' + pct + '" id="dRange"></div>' +
      '<div class="field"><label>Depends on</label>' +
        '<div class="deps" id="dDeps">' + (depRows || '<div class="deps-empty">No dependencies yet.</div>') + '</div>' +
        '<select id="dAddDep" class="dep-add"><option value="">Add a dependency...</option>' + depOptions + '</select></div>' +
      '<div class="field"><label>Note</label>' +
        '<textarea id="dNote" class="note-input" placeholder="Add a note for this task...">' + (t.note ? escapeHtml(t.note) : '') + '</textarea></div>' +
      '<button class="danger-btn" id="dDelete">Remove task</button>';

    var range = document.getElementById('dRange');
    if (range) {
      range.addEventListener('input', function () {
        t.progress = range.value / 100;
        document.getElementById('dFill').style.width = range.value + '%';
        document.getElementById('dProgLabel').textContent = 'Progress ' + range.value + '%';
        refreshItems();
        var treeRow = treeBody.querySelector('.task-row[data-id="' + id + '"] .tpct');
        if (treeRow) treeRow.textContent = range.value + '%';
      });
    }

    // Start / end date editing.
    document.getElementById('dStart').addEventListener('change', function (e) {
      if (!e.target.value) return;
      t.start = e.target.value;
      if (t.end && new Date(t.end) < new Date(t.start)) { t.end = t.start; document.getElementById('dEnd').value = toDateValue(t.end); }
      refreshItems();
    });
    document.getElementById('dEnd').addEventListener('change', function (e) {
      // Clearing the end date turns the task into a milestone (point in time).
      t.end = e.target.value || undefined;
      if (t.end && new Date(t.end) < new Date(t.start)) { t.end = t.start; e.target.value = toDateValue(t.end); }
      refreshItems();
    });

    // Assignee editing. An empty value means unassigned.
    document.getElementById('dAssignee').addEventListener('change', function (e) {
      t.assignee = e.target.value || null;
      refreshItems();
    });

    // Add a dependency.
    document.getElementById('dAddDep').addEventListener('change', function (e) {
      var src = parseInt(e.target.value, 10);
      if (!src) return;
      deps.push({ source: src, target: id });
      applyDeps();
      selectItem(id);   // re-render the drawer with the new dependency row
    });

    // Remove a dependency.
    Array.prototype.forEach.call(document.querySelectorAll('#dDeps .dep-remove'), function (btn) {
      btn.addEventListener('click', function () {
        var src = parseInt(btn.dataset.src, 10);
        deps = deps.filter(function (d) { return !(d.source === src && d.target === id); });
        applyDeps();
        selectItem(id);
      });
    });

    var noteEl = document.getElementById('dNote');
    if (noteEl) {
      noteEl.addEventListener('input', function () {
        var had = hasNote(t);
        t.note = noteEl.value;
        // Only redraw the timeline when the note presence actually changed, so the
        // note glyph appears or disappears without rebuilding on every keystroke.
        if (hasNote(t) !== had) {
          refreshItems();
          updateTreeNote(id);
        }
      });
    }

    document.getElementById('dDelete').addEventListener('click', function () { deleteTask(id); });

    drawer.classList.add('open');
    highlightTreeRow();
  }

  // Apply the current dependency list to the timeline, honouring the Dependencies toggle.
  function applyDeps() {
    timeline.setDependencies(document.getElementById('showDeps').checked ? deps : []);
  }

  // Format a date string as the YYYY-MM-DD value a <input type="date"> expects.
  function toDateValue(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d)) return '';
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  // Remove a task and any dependencies touching it, then refresh everything.
  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    delete taskById[id];
    deps = deps.filter(function (d) { return d.source !== id && d.target !== id; });
    timeline.setItems(buildItems());
    applyDeps();
    buildTree();
    closeDrawer();
  }

  // Create a new task in the given phase and open it for editing.
  function addTask(phase) {
    var p = phaseByName[phase];
    var start = '2026-04-06', end = '2026-04-13';
    var t = { id: nextTaskId++, name: 'New task', phase: phase, start: start, end: end, progress: 0, assignee: null, note: '' };
    tasks.push(t);
    taskById[t.id] = t;
    timeline.setItems(buildItems());
    buildTree();
    timeline.setSelection([t.id]);
    timeline.focus({ id: t.id, animate: true, duration: 450 });
    selectItem(t.id);
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    selectedId = null;
    timeline.clearSelection();
    highlightTreeRow();
  }
  document.getElementById('dClose').addEventListener('click', closeDrawer);

  // ── Zoom presets ──
  var RANGES = {
    month:   ['2026-03-15', '2026-04-20'],
    quarter: ['2026-02-01', '2026-05-01'],
    all:     ['2026-01-28', '2026-06-22']
  };
  document.getElementById('zoomSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-zoom]');
    if (!btn) return;
    document.querySelectorAll('#zoomSeg button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    timeline.focus({ range: RANGES[btn.dataset.zoom], animate: true, duration: 450 });
  });

  // ── Dependencies toggle ──
  document.getElementById('showDeps').addEventListener('change', applyDeps);

  // ── Assignee filter ──
  var af = document.getElementById('assigneeFilter');
  assignees.forEach(function (a) {
    var o = document.createElement('option'); o.value = a; o.textContent = a; af.appendChild(o);
  });
  // A dedicated option for tasks with no assignee.
  var noneOpt = document.createElement('option'); noneOpt.value = '__none__'; noneOpt.textContent = 'Unassigned'; af.appendChild(noneOpt);
  af.addEventListener('change', function () {
    assigneeFilter = af.value;
    timeline.setItems(buildItems());
  });

  buildTree();
  buildBandsPanel();
  window.addEventListener('beforeunload', function () { timeline.destroy(); });
})();
</script>
</body>
</html>
