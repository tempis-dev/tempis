<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogScope — Request Explorer</title>
    <script>
        const timestamp = new Date().getTime();
        document.write('<script src="../lib/tempis_timeline.js?' + timestamp + '"><\/script>');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg: #f4f5f7;
            --panel: #ffffff;
            --border: #e4e7ec;
            --border-strong: #d0d5dd;
            --text: #101828;
            --text-muted: #667085;
            --text-faint: #98a2b3;
            --accent: #6366f1;
            --accent-soft: #eef2ff;
            --green: #12b76a;
            --red: #f04438;
            --amber: #f79009;
            --radius: 10px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: Geist, system-ui, -apple-system, Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ---- Top bar ---- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
            height: 56px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.01em;
        }

        .brand .logo {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.4);
        }

        .brand .sub {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-faint);
            border-left: 1px solid var(--border);
            padding-left: 10px;
            margin-left: 2px;
        }

        .topbar .spacer { flex: 1; }

        .control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .control select {
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            outline: none;
        }

        .control select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .env-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.18);
        }

        .live-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            background: var(--panel);
            transition: all 0.15s ease;
        }

        .live-toggle.active {
            color: var(--green);
            border-color: rgba(18, 183, 106, 0.5);
            background: rgba(18, 183, 106, 0.06);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-faint);
        }

        .live-toggle.active .live-dot {
            background: var(--green);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(18, 183, 106, 0.5); }
            50% { box-shadow: 0 0 0 5px rgba(18, 183, 106, 0); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn:hover { background: #f9fafb; }
        .btn:active { background: #f2f4f7; }

        /* ---- Layout ---- */
        .workspace {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
        }

        /* ---- Stats strip ---- */
        .stats {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-card .value {
            margin-top: 8px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .stat-card .value.small {
            font-size: 15px;
            font-weight: 500;
            font-family: Geist Mono, ui-monospace, Consolas, monospace;
            color: var(--text);
        }

        .stat-card .hint {
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 3px;
        }

        .stat-card .icon {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
        }

        .error-rate .value.ok { color: var(--green); }
        .error-rate .value.warn { color: var(--amber); }
        .error-rate .value.bad { color: var(--red); }

        /* ---- Loading indicator ---- */
        .loading-indicator {
            display: none;
            align-items: center;
            gap: 7px;
            color: var(--accent);
            font-weight: 500;
            font-size: 13px;
        }
        .loading-indicator.active { display: inline-flex; }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .idle-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--green);
        }
        .idle-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        .loading-indicator.active ~ .idle-pill { display: none; }

        /* ---- Main grid: explorer + activity ---- */
        .main-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px;
            align-items: stretch;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header .title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .panel-header .meta {
            font-size: 12px;
            color: var(--text-faint);
        }

        .panel-header .spacer { flex: 1; }

        .explorer-body {
            padding: 12px 14px 14px;
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
        }

        .canvas-container {
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---- Activity feed ---- */
        .activity .panel-header .badge {
            font-size: 11px;
            font-family: Geist Mono, ui-monospace, Consolas, monospace;
            background: #1e1e2e;
            color: #a6adc8;
            padding: 2px 7px;
            border-radius: 20px;
        }

        .load-log {
            flex: 1;
            min-height: 0;
            margin: 0;
            overflow-y: auto;
            font-family: Geist Mono, ui-monospace, Consolas, monospace;
            font-size: 12px;
            line-height: 1.55;
            background: #16161e;
            color: #cdd6f4;
            padding: 12px 14px;
            border-bottom-left-radius: var(--radius);
            border-bottom-right-radius: var(--radius);
        }

        .load-log .entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .load-log .entry .time { color: #89b4fa; }
        .load-log .entry .count { color: #f9e2af; }
        .load-log .entry .range { color: #94e2d5; }
        .load-log .entry .cached { color: #6c7086; }

        .load-log::-webkit-scrollbar { width: 8px; }
        .load-log::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }

        /* ---- Responsive ---- */
        @media (max-width: 1100px) {
            /* Stack and allow scrolling instead of fitting one viewport height. */
            body { height: auto; min-height: 100vh; overflow: auto; }
            .workspace { min-height: 0; }
            .main-grid { grid-template-columns: minmax(0, 1fr); flex: none; }
            .explorer-body { height: 440px; flex: none; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .load-log { min-height: 220px; max-height: 320px; }
        }

        @media (max-width: 640px) {
            .stats { grid-template-columns: 1fr; }
            .brand .sub { display: none; }
            .control.env .lbl { display: none; }
            .workspace { padding: 14px; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <header class="topbar">
        <div class="brand">
            <span class="logo">◭</span>
            LogScope
            <span class="sub">Request Explorer</span>
        </div>

        <div class="spacer"></div>

        <div class="control env">
            <span class="env-dot" id="envDot"></span>
            <span class="lbl">Environment</span>
            <select id="envSelect">
                <option value="production">production</option>
                <option value="staging">staging</option>
                <option value="development">development</option>
            </select>
        </div>

        <button class="btn" id="refreshBtn" title="Reset cache and refetch">↻ Refresh</button>

        <div class="live-toggle active" id="liveToggle">
            <span class="live-dot"></span>
            <span>Live</span>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Stats strip -->
        <div class="stats">
            <div class="stat-card">
                <div class="label"><span class="icon" style="background:#6366f1">Σ</span> Requests loaded</div>
                <div class="value" id="itemCount">0</div>
                <div class="hint" id="rpsHint">across cached blocks</div>
            </div>
            <div class="stat-card">
                <div class="label"><span class="icon" style="background:#0ea5e9">⛁</span> Hour blocks cached</div>
                <div class="value" id="blockCount">0</div>
                <div class="hint">fetched on demand</div>
            </div>
            <div class="stat-card error-rate">
                <div class="label"><span class="icon" style="background:#f04438">!</span> Error rate</div>
                <div class="value ok" id="errorRate">0.0%</div>
                <div class="hint" id="errorHint">4xx + 5xx responses</div>
            </div>
            <div class="stat-card">
                <div class="label"><span class="icon" style="background:#12b76a">◷</span> Visible range</div>
                <div class="value small" id="rangeDisplay">—</div>
                <div class="hint" style="display:flex;align-items:center;gap:10px;margin-top:6px">
                    <span class="loading-indicator" id="loadingIndicator">
                        <span class="spinner"></span> Fetching…
                    </span>
                    <span class="idle-pill" id="idlePill"><span class="dot"></span> Up to date</span>
                </div>
            </div>
        </div>

        <!-- Explorer + activity -->
        <div class="main-grid">
            <section class="panel explorer">
                <div class="panel-header">
                    <span class="title">Request Explorer</span>
                    <span class="meta">— pan &amp; zoom to stream logs on demand</span>
                    <span class="spacer"></span>
                    <span class="meta" id="explorerEnv">production</span>
                </div>
                <div class="explorer-body">
                    <div class="canvas-container">
                        <canvas id="canvas"></canvas>
                    </div>
                </div>
            </section>

            <aside class="panel activity">
                <div class="panel-header">
                    <span class="title">Fetch Activity</span>
                    <span class="spacer"></span>
                    <span class="badge" id="activityBadge">0 fetches</span>
                </div>
                <div class="load-log" id="loadLog"></div>
            </aside>
        </div>
    </div>

<script>
    const { TempisTimeline } = tempis_timeline;

    // --- Simulated server log data source ---
    // In a real app, this would be an API call like: GET /api/logs?from=...&to=...
    const endpoints = ['/api/users', '/api/orders', '/api/products', '/api/auth/login', '/api/search', '/api/payments', '/api/inventory', '/api/reports'];
    const methods = ['GET', 'POST', 'PUT', 'DELETE'];
    const statusCodes = [
        { code: 200, weight: 50 }, { code: 201, weight: 10 }, { code: 204, weight: 5 },
        { code: 301, weight: 3 }, { code: 304, weight: 8 },
        { code: 400, weight: 5 }, { code: 401, weight: 3 }, { code: 403, weight: 2 },
        { code: 404, weight: 6 }, { code: 500, weight: 4 }, { code: 502, weight: 2 }, { code: 503, weight: 2 }
    ];

    function getStatusCategory(code) {
        if (code < 300) return '2xx Success';
        if (code < 400) return '3xx Redirect';
        if (code < 500) return '4xx Client Error';
        return '5xx Server Error';
    }

    // Seeded random for consistent data per hour block
    function seededRandom(seed) {
        let s = seed;
        return function() {
            s = (s * 16807 + 0) % 2147483647;
            return (s - 1) / 2147483646;
        };
    }

    function generateLogsForHour(hourStart) {
        const seed = Math.abs(hourStart.getTime() / 3600000) | 0;
        const rng = seededRandom(seed);
        const logs = [];
        // Generate 20-80 requests per hour
        const count = Math.floor(rng() * 60) + 20;

        for (let i = 0; i < count; i++) {
            const offsetMs = Math.floor(rng() * 3600000);
            const start = new Date(hourStart.getTime() + offsetMs);
            const method = methods[Math.floor(rng() * methods.length)];
            const endpoint = endpoints[Math.floor(rng() * endpoints.length)];
            const statusTotal = statusCodes.reduce((sum, s) => sum + s.weight, 0);
            let r = rng() * statusTotal;
            let status = statusCodes[0].code;
            for (const s of statusCodes) {
                r -= s.weight;
                if (r <= 0) { status = s.code; break; }
            }
            // Duration between 5 seconds and 5 minutes to be visible at a 4-hour range
            const durationMs = Math.floor(rng() * 295000) + 5000;
            const end = new Date(start.getTime() + durationMs);

            logs.push({
                id: `${hourStart.getTime()}-${i}`,
                start: start.toISOString(),
                end: end.toISOString(),
                label: `${method} ${endpoint} → ${status}`,
                category: getStatusCategory(status),
                grouping: endpoint
            });
        }
        return logs;
    }

    // Simulate network latency
    function fetchLogs(hourStart) {
        return new Promise(resolve => {
            const delay = 150 + Math.random() * 300;
            setTimeout(() => resolve(generateLogsForHour(hourStart)), delay);
        });
    }

    // --- Lazy loading logic ---
    const cache = new Map(); // hourKey -> items[]
    let allItems = [];
    let isLoading = false;
    let loadDebounceTimer = null;
    let timeline = null;
    let fetchCount = 0;

    function getHourKey(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate(), date.getHours()).getTime();
    }

    function getHourBlocksInRange(start, end) {
        const blocks = [];
        let current = new Date(start.getFullYear(), start.getMonth(), start.getDate(), start.getHours());
        const endTime = end.getTime();
        while (current.getTime() <= endTime) {
            blocks.push(new Date(current));
            current = new Date(current.getTime() + 3600000);
        }
        return blocks;
    }

    function logEntry(message) {
        const log = document.getElementById('loadLog');
        const now = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `<span class="time">[${now}]</span> ${message}`;
        log.insertBefore(entry, log.firstChild);
        // Keep log manageable
        while (log.children.length > 50) log.removeChild(log.lastChild);
    }

    function updateStats() {
        document.getElementById('itemCount').textContent = allItems.length.toLocaleString();
        document.getElementById('blockCount').textContent = cache.size;
        document.getElementById('activityBadge').textContent = `${fetchCount} fetch${fetchCount === 1 ? '' : 'es'}`;

        // Derived stat: error rate (% of 4xx + 5xx) for realism
        let errors = 0;
        for (const item of allItems) {
            if (item.category === '4xx Client Error' || item.category === '5xx Server Error') errors++;
        }
        const rate = allItems.length ? (errors / allItems.length) * 100 : 0;
        const el = document.getElementById('errorRate');
        el.textContent = rate.toFixed(1) + '%';
        el.classList.remove('ok', 'warn', 'bad');
        el.classList.add(rate < 8 ? 'ok' : rate < 15 ? 'warn' : 'bad');
        document.getElementById('errorHint').textContent = `${errors.toLocaleString()} of ${allItems.length.toLocaleString()} responses`;
    }

    function formatRange(start, end) {
        const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        return `${start.toLocaleString(undefined, opts)} – ${end.toLocaleString(undefined, opts)}`;
    }

    function setLoadingUI(active) {
        document.getElementById('loadingIndicator').classList.toggle('active', active);
        document.getElementById('idlePill').style.display = active ? 'none' : 'inline-flex';
    }

    async function loadRange(start, end) {
        const blocks = getHourBlocksInRange(start, end);
        const uncached = blocks.filter(b => !cache.has(b.getTime()));

        if (uncached.length === 0) return;

        isLoading = true;
        setLoadingUI(true);

        logEntry(`Fetching <span class="count">${uncached.length} hour block(s)</span> for range <span class="range">${formatRange(start, end)}</span>`);

        // Fetch all uncached blocks in parallel
        const results = await Promise.all(uncached.map(async (block) => {
            const logs = await fetchLogs(block);
            cache.set(block.getTime(), logs);
            return logs;
        }));
        fetchCount += uncached.length;

        // Merge new items with existing
        const newItems = results.flat();
        allItems = allItems.concat(newItems);

        logEntry(`Loaded <span class="count">${newItems.length} items</span> from <span class="count">${uncached.length} block(s)</span> — <span class="cached">${cache.size} total cached</span>`);

        // Update the timeline
        timeline.setItems(allItems);
        updateStats();

        isLoading = false;
        setLoadingUI(false);
    }

    function onRangeChange(start, end) {
        document.getElementById('rangeDisplay').textContent = formatRange(start, end);

        // Debounce to avoid flooding during rapid panning
        clearTimeout(loadDebounceTimer);
        loadDebounceTimer = setTimeout(() => {
            if (!isLoading) {
                loadRange(start, end);
            }
        }, 200);
    }

    // --- Cosmetic UI controls (environment selector + live toggle + refresh) ---
    const envColors = { production: '#12b76a', staging: '#f79009', development: '#6366f1' };
    document.getElementById('envSelect').addEventListener('change', (e) => {
        const env = e.target.value;
        document.getElementById('envDot').style.background = envColors[env];
        document.getElementById('explorerEnv').textContent = env;
        logEntry(`Switched environment → <span class="range">${env}</span>`);
    });

    document.getElementById('liveToggle').addEventListener('click', (e) => {
        e.currentTarget.classList.toggle('active');
        const on = e.currentTarget.classList.contains('active');
        logEntry(`Live tail ${on ? 'enabled' : 'paused'}`);
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
        cache.clear();
        allItems = [];
        fetchCount = 0;
        timeline.setItems(allItems);
        updateStats();
        logEntry('Cache cleared — refetching visible range');
        const r = timeline.getRange ? timeline.getRange() : null;
        if (r && r.start && r.end) {
            loadRange(new Date(r.start), new Date(r.end));
        } else {
            loadRange(defaultStart, defaultEnd);
        }
    });

    // --- Initialize ---
    const now = new Date();
    const defaultStart = new Date(now.getTime() - 15 * 60000); // 15 minutes ago
    const defaultEnd = new Date(now.getTime() + 15 * 60000);   // 15 minutes from now

    timeline = new TempisTimeline('#canvas', {
        items: [],
        responsive: true,
        verticalFill: 'fill-canvas',
        stackMode: 'compact',
        style: {
            font: {
                family: "Geist, system-ui, -apple-system, Roboto, sans-serif",
                size: 12
            }
        },
        grouping: { collapsible: true },
        range: {
            start: defaultStart,
            end: defaultEnd,
            position: 'bottom',
            zoom: { enabled: true }
        },
        categories: [
            { name: '2xx Success', label: '2xx Success', style: { backgroundColor: '#4caf50', fontColor: '#fff' } },
            { name: '3xx Redirect', label: '3xx Redirect', style: { backgroundColor: '#2196f3', fontColor: '#fff' } },
            { name: '4xx Client Error', label: '4xx Client Error', style: { backgroundColor: '#ff9800', fontColor: '#fff' } },
            { name: '5xx Server Error', label: '5xx Server Error', style: { backgroundColor: '#f44336', fontColor: '#fff' } }
        ],
        legend: {
            position: 'top',
            isHighlightOnHover: true,
            isFilterOnClick: true
        },
        tooltip: {
            enabled: true,
            overflowBehavior: 'viewport'
        },
        onRangeChange
    });

    // Load initial range
    loadRange(defaultStart, defaultEnd);
</script>
</body>
</html>
