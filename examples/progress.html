<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Indicator — Tempis Timeline</title>
  <script src="../lib/tempis_timeline.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #333; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
    .timeline-container {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
    }
    .timeline-container canvas {
      display: block;
      width: 100%;
      height: 500px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .controls button {
      padding: 6px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .controls button:hover { background: #f0f0f0; }
    .info-box {
      background: #f0f4ff;
      border: 1px solid #d0d8f0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #444;
      margin-bottom: 16px;
    }
    .info-box code { background: #e0e8f8; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Progress Indicator</h1>
    <p class="subtitle">Show completion progress as a fill bar inside range items.</p>

    <div class="info-box">
      Set <code>progress</code> (0–1) on any range item to render a lighter fill from the left edge. The fill respects border radius and is ignored for point-in-time items. Use the buttons below to simulate progress updates.
    </div>

    <div class="controls">
      <button onclick="incrementProgress()">+10% All</button>
      <button onclick="randomiseProgress()">Randomise</button>
      <button onclick="resetProgress()">Reset</button>
    </div>

    <div class="timeline-container">
      <canvas id="timeline"></canvas>
    </div>
  </div>

  <script>
    var TT = tempis_timeline.TempisTimeline;

    var items = [
      // Research
      { id: 1,  label: 'Market Analysis',        start: '2026-02-03', end: '2026-02-14', grouping: 'Research',     category: 'complete',  progress: 1.0 },
      { id: 2,  label: 'User Interviews',        start: '2026-02-10', end: '2026-02-21', grouping: 'Research',     category: 'complete',  progress: 1.0 },
      { id: 3,  label: 'Competitor Audit',        start: '2026-02-17', end: '2026-02-28', grouping: 'Research',     category: 'active',    progress: 0.75 },

      // Design
      { id: 10, label: 'Wireframes',             start: '2026-02-10', end: '2026-02-28', grouping: 'Design',       category: 'active',    progress: 0.6 },
      { id: 11, label: 'Visual Design',          start: '2026-02-24', end: '2026-03-14', grouping: 'Design',       category: 'active',    progress: 0.35 },
      { id: 12, label: 'Prototype',              start: '2026-03-09', end: '2026-03-21', grouping: 'Design',       category: 'pending',   progress: 0 },

      // Development
      { id: 20, label: 'Core Architecture',      start: '2026-02-17', end: '2026-03-07', grouping: 'Development',  category: 'active',    progress: 0.8 },
      { id: 21, label: 'Feature Build',          start: '2026-03-03', end: '2026-03-28', grouping: 'Development',  category: 'active',    progress: 0.2 },
      { id: 22, label: 'API Integration',        start: '2026-03-10', end: '2026-03-28', grouping: 'Development',  category: 'pending',   progress: 0 },
      { id: 23, label: 'Performance Tuning',     start: '2026-03-24', end: '2026-04-04', grouping: 'Development',  category: 'pending',   progress: 0 },

      // Testing
      { id: 30, label: 'Unit Tests',             start: '2026-03-03', end: '2026-03-28', grouping: 'Testing',      category: 'active',    progress: 0.45 },
      { id: 31, label: 'Integration Tests',      start: '2026-03-17', end: '2026-04-04', grouping: 'Testing',      category: 'pending',   progress: 0 },
      { id: 32, label: 'UAT',                    start: '2026-03-31', end: '2026-04-11', grouping: 'Testing',      category: 'pending',   progress: 0 },

      // Milestones
      { id: 40, label: 'Kickoff',                start: '2026-02-03', grouping: 'Milestones', category: 'milestone' },
      { id: 41, label: 'Design Review',          start: '2026-03-14', grouping: 'Milestones', category: 'milestone' },
      { id: 42, label: 'Beta Release',           start: '2026-04-04', grouping: 'Milestones', category: 'milestone' },
    ];

    var tl = new TT('#timeline', {
      responsive: true,
      verticalFill: 'fill-canvas',
      style: { item: { borderRadius: 6, fontColor: '#fff', padding: 8 } },
      grouping: { collapsible: true },
      categories: [
        { name: 'complete',  label: 'Complete',   style: { backgroundColor: '#10b981', fontColor: '#fff' } },
        { name: 'active',    label: 'Active',     style: { backgroundColor: '#6366f1', fontColor: '#fff' } },
        { name: 'pending',   label: 'Pending',    style: { backgroundColor: '#94a3b8', fontColor: '#fff' } },
        { name: 'milestone', label: 'Milestone',  style: { backgroundColor: '#f59e0b', fontColor: '#111' } },
      ],
      legend: { position: 'top', markerStyle: 'circle' },
      items: items,
      bands: [
        { start: '2026-03-14', style: { color: '#f59e0b', borderColor: '#f59e0b', borderThickness: 1 } },
      ],
      range: { start: '2026-01-27', end: '2026-04-14', position: 'bottom' }
    });

    function incrementProgress() {
      items.forEach(function(item) {
        if (item.end && item.progress !== undefined && item.progress < 1 && item.category !== 'milestone') {
          item.progress = Math.min(1, Math.round((item.progress + 0.1) * 100) / 100);
          if (item.progress >= 1) item.category = 'complete';
          else if (item.progress > 0) item.category = 'active';
        }
      });
      tl.setItems(items);
    }

    function randomiseProgress() {
      items.forEach(function(item) {
        if (item.end && item.category !== 'milestone') {
          item.progress = Math.round(Math.random() * 100) / 100;
          if (item.progress >= 1) item.category = 'complete';
          else if (item.progress > 0) item.category = 'active';
          else item.category = 'pending';
        }
      });
      tl.setItems(items);
    }

    function resetProgress() {
      items.forEach(function(item) {
        if (item.end && item.category !== 'milestone') {
          item.progress = 0;
          item.category = 'pending';
        }
      });
      tl.setItems(items);
    }
  </script>
</body>
</html>
