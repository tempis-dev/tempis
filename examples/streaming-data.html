<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempis Markets — Live Trading Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg: #f4f6f9;
            --panel: #ffffff;
            --panel-2: #f7f9fc;
            --border: #e4e8ef;
            --border-soft: #eef1f6;
            --text: #111827;
            --text-dim: #5b6676;
            --text-faint: #98a2b3;
            --up: #15a46b;
            --down: #e5484d;
            --accent: #2563eb;
            --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Geist, system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ───────────── Top bar ───────────── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
            min-height: 54px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.2px;
        }
        .brand .logo {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(135deg, #2563eb, #15a46b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
        }
        .brand .sub {
            color: var(--text-faint);
            font-weight: 400;
            font-size: 12px;
            padding-left: 10px;
            margin-left: 2px;
            border-left: 1px solid var(--border);
        }

        .spacer { flex: 1 1 auto; }

        /* connection pill */
        .conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            white-space: nowrap;
        }
        .conn-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-faint);
            box-shadow: 0 0 0 0 rgba(0,0,0,0);
            transition: background 0.2s;
        }
        .conn-pill.connected { color: var(--up); border-color: rgba(21,164,107,0.35); }
        .conn-pill.connected .dot {
            background: var(--up);
            box-shadow: 0 0 6px 1px rgba(21,164,107,0.5);
            animation: pulse 1.6s infinite;
        }
        .conn-pill.connecting { color: #b26a00; border-color: rgba(217,119,6,0.35); }
        .conn-pill.connecting .dot { background: #d97706; box-shadow: 0 0 6px 1px rgba(217,119,6,0.4); }
        .conn-pill.error { color: var(--down); border-color: rgba(229,72,77,0.35); }
        .conn-pill.error .dot { background: var(--down); box-shadow: 0 0 6px 1px rgba(229,72,77,0.4); }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(21,164,107,0.4); }
            70%  { box-shadow: 0 0 0 6px rgba(21,164,107,0); }
            100% { box-shadow: 0 0 0 0 rgba(21,164,107,0); }
        }

        /* terminal buttons */
        .controls { display: flex; gap: 8px; }
        .btn {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 7px 13px;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover:not(:disabled) { border-color: #cbd2dd; background: var(--panel-2); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.start { color: var(--up); border-color: rgba(21,164,107,0.4); }
        .btn.start:hover:not(:disabled) { background: rgba(21,164,107,0.08); }
        .btn.stop { color: var(--down); border-color: rgba(229,72,77,0.4); }
        .btn.stop:hover:not(:disabled) { background: rgba(229,72,77,0.08); }

        /* ───────────── Layout ───────────── */
        .workspace {
            flex: 1 1 auto;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* watchlist */
        .watchlist {
            flex: 0 0 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
        }
        .panel-head .hint { color: var(--text-faint); letter-spacing: 0.3px; text-transform: none; font-size: 11px; }

        .watchlist-body { overflow-y: auto; flex: 1 1 auto; }

        .ticker-row {
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            gap: 2px 8px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-soft);
            cursor: default;
            transition: background 0.15s;
        }
        .ticker-row:hover { background: var(--panel-2); }
        .ticker-row .sym {
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ticker-row .sym .swatch {
            width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto;
        }
        .ticker-row .name {
            grid-column: 1;
            font-size: 11px;
            color: var(--text-faint);
        }
        .ticker-row .price {
            grid-column: 2;
            grid-row: 1;
            font-family: var(--mono);
            font-size: 13px;
            text-align: right;
            color: var(--text);
            transition: color 0.3s;
        }
        .ticker-row .chg {
            grid-column: 2;
            grid-row: 2;
            font-family: var(--mono);
            font-size: 11px;
            text-align: right;
            color: var(--text-faint);
        }
        .ticker-row.up .price { color: var(--up); }
        .ticker-row.up .chg { color: var(--up); }
        .ticker-row.down .price { color: var(--down); }
        .ticker-row.down .chg { color: var(--down); }

        /* flash on update */
        .flash-up { animation: flashUp 0.5s ease-out; }
        .flash-down { animation: flashDown 0.5s ease-out; }
        @keyframes flashUp { 0% { background: rgba(21,164,107,0.16); } 100% { background: transparent; } }
        @keyframes flashDown { 0% { background: rgba(229,72,77,0.16); } 100% { background: transparent; } }

        /* main */
        .main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--bg);
        }

        .timeline-wrap {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            margin: 0;
        }
        #timeline-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* stats strip */
        .stats {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--panel);
            border-top: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 12px;
        }
        .stat {
            padding: 9px 16px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            border-right: 1px solid var(--border-soft);
        }
        .stat .label {
            font-family: Geist, sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-faint);
        }
        .stat .val { color: var(--text); font-size: 13px; }
        .stat .val.accent { color: var(--accent); }
        .stat .val.up { color: var(--up); }

        /* scrollbars */
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4dae3; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #bcc4d0; }

        /* responsive */
        @media (max-width: 820px) {
            .workspace { flex-direction: column; }
            .watchlist {
                flex: 0 0 auto;
                max-height: 190px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .watchlist-body {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
            .ticker-row { border-right: 1px solid var(--border-soft); }
            .brand .sub { display: none; }
            .stats { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <header class="topbar">
        <div class="brand">
            <span class="logo">T</span>
            <span>Tempis Markets</span>
            <span class="sub">Live Tape · Binance Spot</span>
        </div>
        <div class="spacer"></div>
        <div id="connPill" class="conn-pill">
            <span class="dot"></span>
            <span id="connText">Disconnected</span>
        </div>
        <div class="controls">
            <button id="startBtn" class="btn start">▶ Start</button>
            <button id="stopBtn" class="btn stop" disabled>■ Stop</button>
            <button id="clearBtn" class="btn">⌫ Clear</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Watchlist -->
        <aside class="watchlist">
            <div class="panel-head">
                <span>Watchlist</span>
                <span class="hint">10 pairs</span>
            </div>
            <div id="watchlistBody" class="watchlist-body"></div>
        </aside>

        <!-- Main -->
        <main class="main">
            <div class="panel-head">
                <span>Trade Tape — Price Movement Stream</span>
                <span class="hint">moves &gt; 0.1%</span>
            </div>
            <div class="timeline-wrap">
                <canvas id="timeline-canvas"></canvas>
            </div>
            <!-- Stats strip -->
            <div class="stats">
                <div class="stat">
                    <span class="label">Events</span>
                    <span id="statEvents" class="val accent">0</span>
                </div>
                <div class="stat">
                    <span class="label">Msgs/sec</span>
                    <span id="statRate" class="val">0</span>
                </div>
                <div class="stat">
                    <span class="label">Total Msgs</span>
                    <span id="statMsgs" class="val">0</span>
                </div>
                <div class="stat">
                    <span class="label">Last Update</span>
                    <span id="statLast" class="val">—</span>
                </div>
                <div class="stat">
                    <span class="label">Status</span>
                    <span id="statStatus" class="val">Ready to start</span>
                </div>
            </div>
        </main>
    </div>

    <script src="../lib/tempis_timeline.js"></script>
    <script>
        console.log('Script starting...');

        // ───────────── DOM refs ─────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const connPill = document.getElementById('connPill');
        const connText = document.getElementById('connText');
        const watchlistBody = document.getElementById('watchlistBody');
        const statEvents = document.getElementById('statEvents');
        const statRate = document.getElementById('statRate');
        const statMsgs = document.getElementById('statMsgs');
        const statLast = document.getElementById('statLast');
        const statStatus = document.getElementById('statStatus');

        // ───────────── State ─────────────
        let timeline = null;
        let websocket = null;
        let allEvents = [];
        let isStreaming = false;
        let lastPrices = {};      // Track previous prices for change detection (event logic)
        let refPrices = {};       // First-seen price per coin (watchlist % change)
        let eventIdCounter = 1;   // Simple counter for unique IDs
        let totalMsgs = 0;        // All WebSocket trade messages
        let msgsThisSecond = 0;   // Rolling counter for msgs/sec

        // Cryptocurrency data (matching Binance symbols)
        const cryptoCoins = [
            { id: 'btcusdt', name: 'Bitcoin', symbol: 'BTC', color: '#f7931a' },
            { id: 'ethusdt', name: 'Ethereum', symbol: 'ETH', color: '#627eea' },
            { id: 'solusdt', name: 'Solana', symbol: 'SOL', color: '#9945ff' },
            { id: 'dogeusdt', name: 'Dogecoin', symbol: 'DOGE', color: '#c2a633' },
            { id: 'adausdt', name: 'Cardano', symbol: 'ADA', color: '#0033ad' },
            { id: 'dotusdt', name: 'Polkadot', symbol: 'DOT', color: '#e6007a' },
            { id: 'avaxusdt', name: 'Avalanche', symbol: 'AVAX', color: '#e84142' },
            { id: 'linkusdt', name: 'Chainlink', symbol: 'LINK', color: '#2a5ada' },
            { id: 'maticusdt', name: 'Polygon', symbol: 'MATIC', color: '#8247e5' },
            { id: 'ltcusdt', name: 'Litecoin', symbol: 'LTC', color: '#345d9d' }
        ];

        // ───────────── Watchlist UI ─────────────
        function fmtPrice(p) {
            if (p >= 1000) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            if (p >= 1) return p.toFixed(2);
            return p.toFixed(4);
        }

        function buildWatchlist() {
            watchlistBody.innerHTML = '';
            cryptoCoins.forEach(coin => {
                const row = document.createElement('div');
                row.className = 'ticker-row';
                row.id = `row-${coin.id}`;
                row.innerHTML = `
                    <div class="sym"><span class="swatch" style="background:${coin.color}"></span>${coin.symbol}</div>
                    <div class="price" id="price-${coin.id}">—</div>
                    <div class="name">${coin.name}</div>
                    <div class="chg" id="chg-${coin.id}">—</div>
                `;
                watchlistBody.appendChild(row);
            });
        }

        // Update a single coin's watchlist row on EVERY trade (not just >0.1% moves)
        function updateWatchlistRow(coin, price) {
            const row = document.getElementById(`row-${coin.id}`);
            const priceEl = document.getElementById(`price-${coin.id}`);
            const chgEl = document.getElementById(`chg-${coin.id}`);
            if (!row || !priceEl || !chgEl) return;

            if (refPrices[coin.id] === undefined) refPrices[coin.id] = price;
            const changePercent = ((price - refPrices[coin.id]) / refPrices[coin.id]) * 100;

            priceEl.textContent = `$${fmtPrice(price)}`;
            const arrow = changePercent > 0 ? '▲' : changePercent < 0 ? '▼' : '•';
            chgEl.textContent = `${arrow} ${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%`;

            row.classList.remove('up', 'down');
            if (changePercent > 0) row.classList.add('up');
            else if (changePercent < 0) row.classList.add('down');

            // brief flash based on tick direction vs last price
            const prev = lastPrices[coin.id];
            if (prev !== undefined && price !== prev) {
                const cls = price > prev ? 'flash-up' : 'flash-down';
                row.classList.remove('flash-up', 'flash-down');
                void row.offsetWidth; // restart animation
                row.classList.add(cls);
            }
        }

        // ───────────── Connection status pill ─────────────
        function setConnection(state, text) {
            connPill.classList.remove('connected', 'connecting', 'error');
            if (state) connPill.classList.add(state);
            connText.textContent = text;
        }
        function setStatus(text) { statStatus.textContent = text; }

        // ───────────── Timeline ─────────────
        function initializeTimeline() {
            try {
                console.log('Initializing timeline...');

                if (timeline) {
                    timeline.destroy();
                }

                // Set initial range to show recent price events (last 1 minute)
                const now = new Date();
                const startTime = new Date(now.getTime() - 1 * 60 * 1000); // 1 minute ago
                const endTime = now; // Now

                timeline = new tempis_timeline.TempisTimeline('#timeline-canvas', {
                    responsive: true,
                    verticalFill: 'fill-canvas',
                    items: [],
                    selection: 'single',
                    style: {
                        font: { family: "Geist, system-ui, -apple-system, Roboto, sans-serif", size: 12 }
                    },
                    range: {
                        position: 'bottom',
                        start: startTime,
                        end: endTime,
                        zoom: {
                            enabled: true
                        }
                    }
                });

                console.log('Timeline initialized successfully');
                setStatus('Timeline ready');

            } catch (error) {
                console.error('Error initializing timeline:', error);
                setStatus(`Error: ${error.message}`);
                setConnection('error', 'Error');
            }
        }

        // ───────────── WebSocket ─────────────
        function connectWebSocket() {
            try {
                console.log('Connecting to Binance WebSocket...');

                // Use Binance's public WebSocket API - no authentication required
                // Subscribe to multiple crypto pairs
                const streams = [
                    'btcusdt@trade',
                    'ethusdt@trade',
                    'solusdt@trade',
                    'dogeusdt@trade',
                    'adausdt@trade',
                    'dotusdt@trade',
                    'avaxusdt@trade',
                    'linkusdt@trade',
                    'maticusdt@trade',
                    'ltcusdt@trade'
                ].join('/');

                setConnection('connecting', 'Connecting…');

                websocket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

                websocket.onopen = function(event) {
                    console.log('WebSocket connected successfully');
                    setConnection('connected', 'Connected');
                    setStatus('Waiting for price updates…');
                };

                websocket.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.data) {
                            processBinanceUpdate(message.data);
                        }
                    } catch (error) {
                        console.error('Error parsing WebSocket message:', error);
                    }
                };

                websocket.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    setConnection('error', 'Connection error');
                    setStatus('WebSocket connection error');
                };

                websocket.onclose = function(event) {
                    console.log('WebSocket connection closed:', event.code, event.reason);
                    if (isStreaming) {
                        setConnection('connecting', 'Reconnecting…');
                        setStatus('Connection lost - attempting to reconnect…');

                        // Attempt to reconnect after 3 seconds
                        setTimeout(() => {
                            if (isStreaming) {
                                connectWebSocket();
                            }
                        }, 3000);
                    } else {
                        setConnection('', 'Disconnected');
                    }
                };

            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
                setConnection('error', 'Connection error');
                setStatus(`Connection error: ${error.message}`);
            }
        }

        function processBinanceUpdate(trade) {
            // Binance sends individual trade messages
            // trade.s = symbol (e.g., "BTCUSDT")
            // trade.p = price
            const symbol = trade.s.toLowerCase();
            const coinInfo = cryptoCoins.find(c => c.id === symbol);
            if (!coinInfo) return;

            const currentPrice = parseFloat(trade.p);
            const lastPrice = lastPrices[symbol];
            const now = new Date();

            // Live metrics: every trade message counts
            totalMsgs++;
            msgsThisSecond++;
            statMsgs.textContent = totalMsgs.toLocaleString('en-US');
            statLast.textContent = now.toLocaleTimeString('en-US', { hour12: false });

            // Update the watchlist row on EVERY trade (before recording lastPrice for flash direction)
            updateWatchlistRow(coinInfo, currentPrice);

            // Create event for significant price changes or first time seeing this coin
            let shouldCreateEvent = false;
            let eventType = 'price_update';
            let changePercent = 0;

            if (lastPrice === undefined) {
                // First time seeing this coin
                shouldCreateEvent = true;
                eventType = 'initial_price';
            } else {
                // Calculate price change since last update
                changePercent = ((currentPrice - lastPrice) / lastPrice) * 100;

                // Create event for changes > 0.1% (more sensitive for real-time data)
                if (Math.abs(changePercent) > 0.1) {
                    shouldCreateEvent = true;
                    eventType = changePercent > 0 ? 'price_increase' : 'price_decrease';
                }
            }

            if (shouldCreateEvent) {
                let label = '';
                let itemStyle = {};

                if (eventType === 'initial_price') {
                    label = `${coinInfo.symbol} $${currentPrice.toFixed(2)}`;
                    itemStyle = {
                        backgroundColor: '#2196F3', // Blue for initial price
                        fontColor: '#ffffff'
                    };
                } else {
                    const direction = changePercent > 0 ? '↗' : '↘';
                    label = `${coinInfo.symbol} $${currentPrice.toFixed(2)} ${direction} ${Math.abs(changePercent).toFixed(2)}%`;
                    itemStyle = {
                        backgroundColor: changePercent > 0 ? '#15a46b' : '#e5484d', // Green up / red down
                        fontColor: '#ffffff'
                    };
                }

                const newEvent = {
                    id: eventIdCounter++,
                    label: label,
                    start: now,
                    grouping: coinInfo.name,
                    style: itemStyle
                };

                allEvents.push(newEvent);

                // Keep only the last 100 events
                if (allEvents.length > 100) {
                    allEvents = allEvents.slice(-100);
                }

                // Update timeline items
                timeline.setItems([...allEvents]);

                // Focus on the newest event with animation (follow the latest)
                timeline.focus({
                    id: newEvent.id,
                    animate: true,
                    duration: 800,
                    easing: 'easeOutCubic',
                    zoom: false
                });

                statEvents.textContent = allEvents.length.toLocaleString('en-US');
                setStatus('Streaming');
            }

            // Update last price
            lastPrices[symbol] = currentPrice;
        }

        // ───────────── Msgs/sec ticker ─────────────
        setInterval(() => {
            statRate.textContent = msgsThisSecond.toString();
            msgsThisSecond = 0;
        }, 1000);

        // ───────────── Controls ─────────────
        function startStreaming() {
            if (isStreaming) return;

            isStreaming = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            setStatus('Connecting to live stream…');
            connectWebSocket();
        }

        function stopStreaming() {
            if (!isStreaming) return;

            isStreaming = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;

            if (websocket) {
                websocket.close();
                websocket = null;
            }

            setConnection('', 'Disconnected');
            setStatus('Streaming stopped');
        }

        startBtn.addEventListener('click', () => {
            console.log('Start button clicked');
            startStreaming();
        });

        stopBtn.addEventListener('click', () => {
            console.log('Stop button clicked');
            stopStreaming();
        });

        clearBtn.addEventListener('click', () => {
            console.log('Clear button clicked');
            if (timeline) {
                timeline.setItems([]);
            }
            allEvents = [];
            lastPrices = {};
            refPrices = {};
            eventIdCounter = 1;
            totalMsgs = 0;
            msgsThisSecond = 0;
            statEvents.textContent = '0';
            statMsgs.textContent = '0';
            statRate.textContent = '0';
            statLast.textContent = '—';
            buildWatchlist();
            setStatus('Timeline cleared');
        });

        // ───────────── Boot ─────────────
        if (typeof tempis_timeline === 'undefined') {
            console.error('tempis_timeline is not loaded!');
            setConnection('error', 'Library error');
            setStatus('Error: Timeline library not loaded');
        } else {
            console.log('tempis_timeline loaded successfully');
        }

        console.log('Setting up timeline...');
        buildWatchlist();
        initializeTimeline();

        // Start streaming automatically on page load
        setTimeout(() => {
            startStreaming();
        }, 1000); // Small delay to ensure timeline is fully initialized

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            stopStreaming();
            if (timeline) {
                timeline.destroy();
            }
        });

        console.log('Script loaded successfully');
    </script>
</body>
</html>
