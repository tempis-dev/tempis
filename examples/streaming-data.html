<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempis Markets — Live Trading Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg: #f4f6f9;
            --panel: #ffffff;
            --panel-2: #f7f9fc;
            --border: #e4e8ef;
            --border-soft: #eef1f6;
            --text: #111827;
            --text-dim: #5b6676;
            --text-faint: #98a2b3;
            --up: #15a46b;
            --down: #e5484d;
            --accent: #2563eb;
            --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Geist, system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ───────────── Top bar ───────────── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
            min-height: 54px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.2px;
        }
        .brand .logo {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(135deg, #2563eb, #15a46b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
        }
        .brand .sub {
            color: var(--text-faint);
            font-weight: 400;
            font-size: 12px;
            padding-left: 10px;
            margin-left: 2px;
            border-left: 1px solid var(--border);
        }

        .spacer { flex: 1 1 auto; }

        /* connection pill */
        .conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            white-space: nowrap;
        }
        .conn-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-faint);
            box-shadow: 0 0 0 0 rgba(0,0,0,0);
            transition: background 0.2s;
        }
        .conn-pill.connected { color: var(--up); border-color: rgba(21,164,107,0.35); }
        .conn-pill.connected .dot {
            background: var(--up);
            box-shadow: 0 0 6px 1px rgba(21,164,107,0.5);
            animation: pulse 1.6s infinite;
        }
        .conn-pill.connecting { color: #b26a00; border-color: rgba(217,119,6,0.35); }
        .conn-pill.connecting .dot { background: #d97706; box-shadow: 0 0 6px 1px rgba(217,119,6,0.4); }
        .conn-pill.error { color: var(--down); border-color: rgba(229,72,77,0.35); }
        .conn-pill.error .dot { background: var(--down); box-shadow: 0 0 6px 1px rgba(229,72,77,0.4); }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(21,164,107,0.4); }
            70%  { box-shadow: 0 0 0 6px rgba(21,164,107,0); }
            100% { box-shadow: 0 0 0 0 rgba(21,164,107,0); }
        }

        /* terminal buttons */
        .controls { display: flex; gap: 8px; }
        .btn {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 7px 13px;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover:not(:disabled) { border-color: #cbd2dd; background: var(--panel-2); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.start { color: var(--up); border-color: rgba(21,164,107,0.4); }
        .btn.start:hover:not(:disabled) { background: rgba(21,164,107,0.08); }
        .btn.stop { color: var(--down); border-color: rgba(229,72,77,0.4); }
        .btn.stop:hover:not(:disabled) { background: rgba(229,72,77,0.08); }

        /* ───────────── Layout ───────────── */
        .workspace {
            flex: 1 1 auto;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* watchlist */
        .watchlist {
            flex: 0 0 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
        }
        .panel-head .hint { color: var(--text-faint); letter-spacing: 0.3px; text-transform: none; font-size: 11px; }
        .panel-head .head-spacer { flex: 1 1 auto; }
        .chip {
            font-family: Geist, sans-serif;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0.2px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--panel-2);
            color: var(--text-dim);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
        }
        .chip:hover { color: var(--text); border-color: #cbd2dd; }

        /* threshold dropdown */
        .thresh {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: Geist, sans-serif;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0.2px;
            color: var(--text-dim);
        }
        .thresh select {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            outline: none;
        }
        .thresh select:focus { border-color: var(--accent); }

        /* selected watchlist row */
        .ticker-row.selected {
            background: var(--panel-2);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        /* ───────────── Event dialog ───────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .overlay.open { display: flex; }
        .dialog {
            width: 340px;
            max-width: calc(100vw - 32px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(17,24,39,0.25);
            overflow: hidden;
            animation: dialogIn 0.16s ease-out;
        }
        @keyframes dialogIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to   { opacity: 1; transform: none; }
        }
        .dialog-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-soft);
        }
        .dialog-head .coin-dot { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
        .dialog-head .coin { font-weight: 600; font-size: 15px; }
        .dialog-head .coin small { color: var(--text-faint); font-weight: 400; margin-left: 6px; }
        .dialog-head .x {
            margin-left: auto; cursor: pointer; color: var(--text-faint);
            font-size: 18px; line-height: 1; border: none; background: none; padding: 2px 4px;
        }
        .dialog-head .x:hover { color: var(--text); }
        .dialog-body { padding: 6px 18px 18px; }
        .dialog-row {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 11px 0; border-bottom: 1px solid var(--border-soft);
            font-size: 13px;
        }
        .dialog-row:last-child { border-bottom: none; }
        .dialog-row .k { color: var(--text-dim); }
        .dialog-row .v { font-family: var(--mono); color: var(--text); }
        .dialog-row .v.up { color: var(--up); }
        .dialog-row .v.down { color: var(--down); }

        .watchlist-body { overflow-y: auto; flex: 1 1 auto; }

        .ticker-row {
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            gap: 2px 8px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-soft);
            cursor: default;
            transition: background 0.15s;
        }
        .ticker-row:hover { background: var(--panel-2); }
        .ticker-row .sym {
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ticker-row .sym .swatch {
            width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto;
        }
        .ticker-row .name {
            grid-column: 1;
            font-size: 11px;
            color: var(--text-faint);
        }
        .ticker-row .price {
            grid-column: 2;
            grid-row: 1;
            font-family: var(--mono);
            font-size: 13px;
            text-align: right;
            color: var(--text);
            transition: color 0.3s;
        }
        .ticker-row .chg {
            grid-column: 2;
            grid-row: 2;
            font-family: var(--mono);
            font-size: 11px;
            text-align: right;
            color: var(--text-faint);
        }
        .ticker-row.up .price { color: var(--up); }
        .ticker-row.up .chg { color: var(--up); }
        .ticker-row.down .price { color: var(--down); }
        .ticker-row.down .chg { color: var(--down); }

        /* flash on update */
        .flash-up { animation: flashUp 0.5s ease-out; }
        .flash-down { animation: flashDown 0.5s ease-out; }
        @keyframes flashUp { 0% { background: rgba(21,164,107,0.16); } 100% { background: transparent; } }
        @keyframes flashDown { 0% { background: rgba(229,72,77,0.16); } 100% { background: transparent; } }

        /* main */
        .main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--bg);
        }

        .timeline-wrap {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            margin: 0;
        }
        #timeline-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* stats strip */
        .stats {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--panel);
            border-top: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 12px;
        }
        .stat {
            padding: 9px 16px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            border-right: 1px solid var(--border-soft);
        }
        .stat .label {
            font-family: Geist, sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-faint);
        }
        .stat .val { color: var(--text); font-size: 13px; }
        .stat .val.accent { color: var(--accent); }
        .stat .val.up { color: var(--up); }
        .stat .val.down { color: var(--down); }

        /* scrollbars */
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4dae3; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #bcc4d0; }

        /* responsive */
        @media (max-width: 820px) {
            .workspace { flex-direction: column; }
            .watchlist {
                flex: 0 0 auto;
                max-height: 190px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .watchlist-body {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
            .ticker-row { border-right: 1px solid var(--border-soft); }
            .brand .sub { display: none; }
            .stats { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <header class="topbar">
        <div class="brand">
            <span class="logo">T</span>
            <span>Tempis Markets</span>
            <span class="sub">Live Prices · Binance Spot</span>
        </div>
        <div class="spacer"></div>
        <div id="connPill" class="conn-pill">
            <span class="dot"></span>
            <span id="connText">Disconnected</span>
        </div>
        <div class="controls">
            <button id="startBtn" class="btn start">▶ Start</button>
            <button id="stopBtn" class="btn stop" disabled>■ Stop</button>
            <button id="clearBtn" class="btn">⌫ Clear</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Watchlist -->
        <aside class="watchlist">
            <div class="panel-head">
                <span>Watchlist</span>
                <span class="hint">10 pairs</span>
            </div>
            <div id="watchlistBody" class="watchlist-body"></div>
        </aside>

        <!-- Main -->
        <main class="main">
            <div class="panel-head">
                <span id="tapeTitle">Price Changes — All Pairs</span>
                <span class="head-spacer"></span>
                <label class="thresh">
                    Show moves ≥
                    <select id="thresholdSelect"></select>
                </label>
                <button id="allBtn" class="chip" style="display:none; margin-left:12px;">← All pairs</button>
            </div>
            <div class="timeline-wrap">
                <canvas id="timeline-canvas"></canvas>
            </div>
            <!-- Stats strip -->
            <div class="stats">
                <div class="stat">
                    <span class="label">Events logged</span>
                    <span id="statEvents" class="val accent">0</span>
                </div>
                <div class="stat">
                    <span class="label">Top mover</span>
                    <span id="statTopMover" class="val">—</span>
                </div>
                <div class="stat">
                    <span class="label">Feed</span>
                    <span id="statRate" class="val">0 msg/s</span>
                </div>
                <div class="stat">
                    <span class="label">Last update</span>
                    <span id="statLast" class="val">—</span>
                </div>
                <div class="stat">
                    <span class="label">Status</span>
                    <span id="statStatus" class="val">Ready to start</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Event detail dialog -->
    <div class="overlay" id="eventOverlay">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgCoin">
            <div class="dialog-head">
                <span class="coin-dot" id="dlgDot"></span>
                <span class="coin" id="dlgCoin"></span>
                <button class="x" id="dlgClose" aria-label="Close">×</button>
            </div>
            <div class="dialog-body" id="dlgBody"></div>
        </div>
    </div>

    <script src="../lib/tempis_timeline.js"></script>
    <script>
        console.log('Script starting...');

        // ───────────── DOM refs ─────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const connPill = document.getElementById('connPill');
        const connText = document.getElementById('connText');
        const watchlistBody = document.getElementById('watchlistBody');
        const statEvents = document.getElementById('statEvents');
        const statRate = document.getElementById('statRate');
        const statTopMover = document.getElementById('statTopMover');
        const statLast = document.getElementById('statLast');
        const statStatus = document.getElementById('statStatus');
        const tapeTitle = document.getElementById('tapeTitle');
        const allBtn = document.getElementById('allBtn');
        const eventOverlay = document.getElementById('eventOverlay');

        // ───────────── State ─────────────
        let timeline = null;
        let websocket = null;
        let isStreaming = false;
        let focusedCoin = null;   // Coin id when filtered to a single pair, else null
        let eventIdCounter = 1;

        // Per-coin live state
        let lastPrices = {};      // Last trade price (watchlist flash direction)
        let refPrices = {};       // First price seen per coin (watchlist session %)
        let lastRecorded = {};    // Price at the last recorded timeline event, per coin

        // Live message metrics
        let totalMsgs = 0;
        let msgsThisSecond = 0;

        // How big a move (since the coin's last recorded point) counts as significant.
        // User-adjustable via the dropdown; defaults are set per view at runtime.
        let thresholdPct = 0.075;

        // Master event log across ALL coins. Coin selection just filters the view.
        // Each entry: { id, coinId, kind, price, changePercent, time }
        //   kind: 'up' | 'down'   (all point-in-time)
        let events = [];
        const MAX_EVENTS = 300;   // keep the log bounded

        // Cryptocurrency data (matching Binance symbols)
        const cryptoCoins = [
            { id: 'btcusdt', name: 'Bitcoin', symbol: 'BTC', color: '#f7931a' },
            { id: 'ethusdt', name: 'Ethereum', symbol: 'ETH', color: '#627eea' },
            { id: 'solusdt', name: 'Solana', symbol: 'SOL', color: '#9945ff' },
            { id: 'dogeusdt', name: 'Dogecoin', symbol: 'DOGE', color: '#c2a633' },
            { id: 'adausdt', name: 'Cardano', symbol: 'ADA', color: '#0033ad' },
            { id: 'dotusdt', name: 'Polkadot', symbol: 'DOT', color: '#e6007a' },
            { id: 'avaxusdt', name: 'Avalanche', symbol: 'AVAX', color: '#e84142' },
            { id: 'linkusdt', name: 'Chainlink', symbol: 'LINK', color: '#2a5ada' },
            { id: 'maticusdt', name: 'Polygon', symbol: 'MATIC', color: '#8247e5' },
            { id: 'ltcusdt', name: 'Litecoin', symbol: 'LTC', color: '#345d9d' }
        ];

        const coinById = {};
        cryptoCoins.forEach(c => { coinById[c.id] = c; });

        // ───────────── Price formatting ─────────────
        // Overview/watchlist formatting (coarser).
        function fmtPrice(p) {
            if (p >= 1000) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            if (p >= 1) return p.toFixed(2);
            return p.toFixed(4);
        }

        function buildWatchlist() {
            watchlistBody.innerHTML = '';
            cryptoCoins.forEach(coin => {
                const row = document.createElement('div');
                row.className = 'ticker-row';
                row.id = `row-${coin.id}`;
                row.style.cursor = 'pointer';
                row.title = `Click to drill into ${coin.name}`;
                row.innerHTML = `
                    <div class="sym"><span class="swatch" style="background:${coin.color}"></span>${coin.symbol}</div>
                    <div class="price" id="price-${coin.id}">—</div>
                    <div class="name">${coin.name}</div>
                    <div class="chg" id="chg-${coin.id}">—</div>
                `;
                // Click a pair to drill into just that coin (toggle off to go back to all).
                row.addEventListener('click', () => {
                    if (focusedCoin === coin.id) setFocusedCoin(null);
                    else setFocusedCoin(coin.id);
                });
                watchlistBody.appendChild(row);
            });
        }

        // Threshold options & defaults differ per view. The per-coin view allows much
        // finer thresholds since a single pair's moves are small; the overview starts
        // coarser so the all-pairs feed stays readable.
        const OVERVIEW_THRESHOLDS = ['0.02', '0.05', '0.075', '0.1', '0.25', '0.5', '1'];
        const FOCUS_THRESHOLDS = ['0.001', '0.005', '0.01', '0.02', '0.05', '0.075', '0.1', '0.25', '0.5', '1'];
        const OVERVIEW_DEFAULT = '0.075';
        const FOCUS_DEFAULT = '0.02';

        const thresholdSelect = document.getElementById('thresholdSelect');

        // Populate the dropdown for the current view and apply its default threshold.
        function applyThresholdOptions(forFocus) {
            const opts = forFocus ? FOCUS_THRESHOLDS : OVERVIEW_THRESHOLDS;
            const def = forFocus ? FOCUS_DEFAULT : OVERVIEW_DEFAULT;
            thresholdSelect.innerHTML = opts.map(v => `<option value="${v}">${v}%</option>`).join('');
            thresholdSelect.value = def;
            setThreshold(parseFloat(def));
        }

        // Set the active threshold and re-baseline each coin so new items use it from
        // here on (without retroactively changing what's already logged).
        function setThreshold(pct) {
            thresholdPct = pct;
            lastRecorded = {};
            for (const id in lastPrices) lastRecorded[id] = lastPrices[id];
        }

        // ───────────── Coin focus / filter ─────────────
        // Selecting a coin just filters the view — it never resets data.
        function setFocusedCoin(coinId) {
            focusedCoin = coinId;

            document.querySelectorAll('.ticker-row.selected').forEach(r => r.classList.remove('selected'));
            if (coinId) {
                const row = document.getElementById(`row-${coinId}`);
                if (row) row.classList.add('selected');
                const coin = coinById[coinId];
                tapeTitle.textContent = `Price Changes — ${coin.name} (${coin.symbol})`;
                allBtn.style.display = '';
            } else {
                tapeTitle.textContent = 'Price Changes — All Pairs';
                allBtn.style.display = 'none';
            }

            // Swap the threshold options/default to match the new view.
            applyThresholdOptions(!!coinId);

            renderTape(true);
        }

        // Build the visible timeline items from the event log for the current view.
        function renderTape(focusLatest) {
            const items = events
                .filter(e => !focusedCoin || e.coinId === focusedCoin)
                .map(e => eventToItem(e));

            timeline.setItems(items);
            statEvents.textContent = items.length.toLocaleString('en-US');

            if (focusLatest && items.length) {
                const lastId = items[items.length - 1].id;
                timeline.focus({ id: lastId, animate: true, duration: 500, easing: 'easeOutCubic', zoom: false });
            }
        }

        // Turn an event into a point-in-time timeline item.
        //   up    → green ▲ with the % rise
        //   down  → red ▼ with the % fall
        function eventToItem(e) {
            const coin = coinById[e.coinId];
            const isUp = e.kind === 'up';
            const bg = isUp ? '#15a46b' : '#e5484d';
            const arrow = isUp ? '▲' : '▼';
            const sign = isUp ? '+' : '';
            // 3dp so the smallest selectable threshold (0.001%) still shows a value.
            const label = `${coin.symbol} ${arrow} $${fmtPrice(e.price)} (${sign}${e.changePercent.toFixed(3)}%)`;
            return {
                id: e.id,
                label: label,
                start: e.time,
                grouping: coin.name,
                style: { backgroundColor: bg, fontColor: '#ffffff', borderRadius: 4 }
            };
        }

        // Append an event and refresh the tape if it's visible in the current view.
        function addEvent(e) {
            e.id = eventIdCounter++;
            events.push(e);
            if (events.length > MAX_EVENTS) events = events.slice(-MAX_EVENTS);

            const visible = !focusedCoin || e.coinId === focusedCoin;
            if (visible) renderTape(true);
        }

        // Update a single coin's watchlist row on EVERY trade (not just >0.1% moves)
        function updateWatchlistRow(coin, price) {
            const row = document.getElementById(`row-${coin.id}`);
            const priceEl = document.getElementById(`price-${coin.id}`);
            const chgEl = document.getElementById(`chg-${coin.id}`);
            if (!row || !priceEl || !chgEl) return;

            if (refPrices[coin.id] === undefined) refPrices[coin.id] = price;
            const changePercent = ((price - refPrices[coin.id]) / refPrices[coin.id]) * 100;

            priceEl.textContent = `$${fmtPrice(price)}`;
            const arrow = changePercent > 0 ? '▲' : changePercent < 0 ? '▼' : '•';
            chgEl.textContent = `${arrow} ${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%`;

            row.classList.remove('up', 'down');
            if (changePercent > 0) row.classList.add('up');
            else if (changePercent < 0) row.classList.add('down');

            // Flash uses the SAME session basis as the row colour, so a coin that's
            // up on the session only ever flashes green (never red on a bump).
            const prev = lastPrices[coin.id];
            if (prev !== undefined && price !== prev) {
                const cls = changePercent >= 0 ? 'flash-up' : 'flash-down';
                row.classList.remove('flash-up', 'flash-down');
                void row.offsetWidth; // restart animation
                row.classList.add(cls);
            }
        }

        // ───────────── Connection status pill ─────────────
        function setConnection(state, text) {
            connPill.classList.remove('connected', 'connecting', 'error');
            if (state) connPill.classList.add(state);
            connText.textContent = text;
        }
        function setStatus(text) { statStatus.textContent = text; }

        // ───────────── Timeline ─────────────
        function initializeTimeline() {
            try {
                console.log('Initializing timeline...');

                if (timeline) {
                    timeline.destroy();
                }

                // A one-minute default window gives items room to spread out.
                const now = new Date();
                const startTime = new Date(now.getTime() - 60 * 1000); // 1 minute ago
                const endTime = new Date(now.getTime() + 5 * 1000);    // small lead

                timeline = new tempis_timeline.TempisTimeline('#timeline-canvas', {
                    responsive: true,
                    verticalFill: 'fill-canvas',
                    items: [],
                    selection: 'none',
                    style: {
                        font: { family: "Geist, system-ui, -apple-system, Roboto, sans-serif", size: 12 }
                    },
                    range: {
                        position: 'bottom',
                        start: startTime,
                        end: endTime,
                        zoom: {
                            enabled: true
                        }
                    },
                    // Clicking an event opens a detail dialog (no selection state on the timeline).
                    onItemClick: function(id) { openEventDialog(id); }
                });

                console.log('Timeline initialized successfully');
                setStatus('Timeline ready');

            } catch (error) {
                console.error('Error initializing timeline:', error);
                setStatus(`Error: ${error.message}`);
                setConnection('error', 'Error');
            }
        }

        // ───────────── WebSocket ─────────────
        function connectWebSocket() {
            try {
                console.log('Connecting to Binance WebSocket...');

                // Use Binance's public WebSocket API - no authentication required
                // Subscribe to multiple crypto pairs
                const streams = [
                    'btcusdt@trade',
                    'ethusdt@trade',
                    'solusdt@trade',
                    'dogeusdt@trade',
                    'adausdt@trade',
                    'dotusdt@trade',
                    'avaxusdt@trade',
                    'linkusdt@trade',
                    'maticusdt@trade',
                    'ltcusdt@trade'
                ].join('/');

                setConnection('connecting', 'Connecting…');

                websocket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

                websocket.onopen = function(event) {
                    console.log('WebSocket connected successfully');
                    setConnection('connected', 'Connected');
                    setStatus('Waiting for price updates…');
                };

                websocket.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.data) {
                            processBinanceUpdate(message.data);
                        }
                    } catch (error) {
                        console.error('Error parsing WebSocket message:', error);
                    }
                };

                websocket.onerror = function(error) {
                    // Ignore errors that fire as a result of us deliberately stopping —
                    // only surface them while we're actually trying to stream.
                    if (!isStreaming) return;
                    console.error('WebSocket error:', error);
                    setConnection('error', 'Connection error');
                    setStatus('WebSocket connection error');
                };

                websocket.onclose = function(event) {
                    console.log('WebSocket connection closed:', event.code, event.reason);
                    if (isStreaming) {
                        setConnection('connecting', 'Reconnecting…');
                        setStatus('Connection lost - attempting to reconnect…');

                        // Attempt to reconnect after 3 seconds
                        setTimeout(() => {
                            if (isStreaming) {
                                connectWebSocket();
                            }
                        }, 3000);
                    } else {
                        setConnection('', 'Disconnected');
                    }
                };

            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
                setConnection('error', 'Connection error');
                setStatus(`Connection error: ${error.message}`);
            }
        }

        function processBinanceUpdate(trade) {
            // Binance sends individual trade messages
            // trade.s = symbol (e.g., "BTCUSDT"), trade.p = price
            const symbol = trade.s.toLowerCase();
            const coinInfo = cryptoCoins.find(c => c.id === symbol);
            if (!coinInfo) return;

            const currentPrice = parseFloat(trade.p);
            const now = new Date();

            // Live metrics: every trade message counts
            totalMsgs++;
            msgsThisSecond++;
            statLast.textContent = now.toLocaleTimeString('en-US', { hour12: false });

            // Update the watchlist row on EVERY trade (the live continuous view).
            updateWatchlistRow(coinInfo, currentPrice);

            // Decide whether this trade is a significant enough move to add to the timeline.
            recordIfSignificant(coinInfo, currentPrice, now);

            lastPrices[symbol] = currentPrice;
            setStatus('Streaming');
        }

        // ───────────── Significant-change detection ─────────────
        // The first price we see for a coin just sets its baseline — no item. After
        // that, every item represents a move of at least `thresholdPct` from the last
        // recorded point: an "up" (green ▲) or a "down" (red ▼).
        function recordIfSignificant(coin, price, now) {
            const symbol = coin.id;
            const prev = lastRecorded[symbol];

            if (prev === undefined) {
                lastRecorded[symbol] = price; // baseline only
                return;
            }

            const changePercent = ((price - prev) / prev) * 100;
            if (Math.abs(changePercent) >= thresholdPct) {
                lastRecorded[symbol] = price;
                addEvent({
                    coinId: symbol,
                    kind: changePercent > 0 ? 'up' : 'down',
                    price: price,
                    changePercent: changePercent,
                    time: now
                });
            }
        }

        // ───────────── Event detail dialog ─────────────
        const EVENT_KIND_LABEL = {
            'up': 'Price up',
            'down': 'Price down'
        };

        function openEventDialog(id) {
            const d = events.find(e => e.id === id);
            if (!d) return;
            const coin = coinById[d.coinId];

            document.getElementById('dlgDot').style.background = coin.color;
            document.getElementById('dlgCoin').innerHTML = `${coin.symbol} <small>${coin.name}</small>`;

            const chgClass = d.changePercent >= 0 ? 'up' : 'down';
            const chgText = `${d.changePercent >= 0 ? '+' : ''}${d.changePercent.toFixed(3)}%`;

            document.getElementById('dlgBody').innerHTML = `
                <div class="dialog-row"><span class="k">Event</span><span class="v">${EVENT_KIND_LABEL[d.kind]}</span></div>
                <div class="dialog-row"><span class="k">Price</span><span class="v">$${fmtPrice(d.price)}</span></div>
                <div class="dialog-row"><span class="k">Change</span><span class="v ${chgClass}">${chgText}</span></div>
                <div class="dialog-row"><span class="k">Pair</span><span class="v">${coin.symbol}USDT</span></div>
                <div class="dialog-row"><span class="k">Time</span><span class="v">${d.time.toLocaleTimeString('en-US', { hour12: false })}</span></div>`;

            eventOverlay.classList.add('open');
        }
        function closeEventDialog() { eventOverlay.classList.remove('open'); }

        document.getElementById('dlgClose').addEventListener('click', closeEventDialog);
        eventOverlay.addEventListener('click', (e) => { if (e.target === eventOverlay) closeEventDialog(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEventDialog(); });
        allBtn.addEventListener('click', () => setFocusedCoin(null));

        // Threshold dropdown — controls how big a move counts as significant.
        thresholdSelect.addEventListener('change', (e) => {
            setThreshold(parseFloat(e.target.value));
        });

        // ───────────── Live stats ticker ─────────────
        setInterval(() => {
            statRate.textContent = `${msgsThisSecond} msg/s`;
            msgsThisSecond = 0;

            // Top mover = coin with the largest absolute session % change so far.
            let best = null;
            for (const coin of cryptoCoins) {
                const ref = refPrices[coin.id];
                const last = lastPrices[coin.id];
                if (ref === undefined || last === undefined || ref === 0) continue;
                const pct = ((last - ref) / ref) * 100;
                if (!best || Math.abs(pct) > Math.abs(best.pct)) best = { coin, pct };
            }
            if (best) {
                const sign = best.pct >= 0 ? '+' : '';
                statTopMover.textContent = `${best.coin.symbol} ${sign}${best.pct.toFixed(2)}%`;
                statTopMover.className = 'val ' + (best.pct >= 0 ? 'up' : 'down');
            }
        }, 1000);

        // ───────────── Controls ─────────────
        function startStreaming() {
            if (isStreaming) return;

            isStreaming = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            setStatus('Connecting to live stream…');
            connectWebSocket();
        }

        function stopStreaming() {
            if (!isStreaming) return;

            isStreaming = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;

            if (websocket) {
                // Detach handlers first so the close/error that follows our own
                // close() call can't override the "stopped" status.
                websocket.onopen = websocket.onmessage = websocket.onerror = websocket.onclose = null;
                websocket.close();
                websocket = null;
            }

            setConnection('', 'Disconnected');
            setStatus('Streaming stopped');
        }

        startBtn.addEventListener('click', () => {
            console.log('Start button clicked');
            startStreaming();
        });

        stopBtn.addEventListener('click', () => {
            console.log('Stop button clicked');
            stopStreaming();
        });

        clearBtn.addEventListener('click', () => {
            console.log('Clear button clicked');
            if (timeline) {
                timeline.setItems([]);
            }
            events = [];
            lastPrices = {};
            refPrices = {};
            lastRecorded = {};
            eventIdCounter = 1;
            totalMsgs = 0;
            msgsThisSecond = 0;
            statEvents.textContent = '0';
            statTopMover.textContent = '—';
            statTopMover.className = 'val';
            statRate.textContent = '0 msg/s';
            statLast.textContent = '—';
            setFocusedCoin(null);
            buildWatchlist();
            setStatus('Events cleared');
        });

        // ───────────── Boot ─────────────
        if (typeof tempis_timeline === 'undefined') {
            console.error('tempis_timeline is not loaded!');
            setConnection('error', 'Library error');
            setStatus('Error: Timeline library not loaded');
        } else {
            console.log('tempis_timeline loaded successfully');
        }

        console.log('Setting up timeline...');
        buildWatchlist();
        initializeTimeline();
        applyThresholdOptions(false); // start in the overview with its options/default

        // Start streaming automatically on page load
        setTimeout(() => {
            startStreaming();
        }, 1000); // Small delay to ensure timeline is fully initialized

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            stopStreaming();
            if (timeline) {
                timeline.destroy();
            }
        });

        console.log('Script loaded successfully');
    </script>
</body>
</html>
