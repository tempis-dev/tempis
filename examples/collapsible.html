<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collapsible Groups — Tempis Timeline</title>
  <script src="../lib/tempis_timeline.js"></script>
  <style>
    :root { --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a; --text: #e8e8e8; --muted: #888; --accent: #10b981; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.6em; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .card-header h2 { font-size: 0.9em; font-weight: 700; }
    .card-header .spacer { flex: 1; }
    .card-header button { background: rgba(16,185,129,0.15); color: var(--accent); border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .card-header button:hover { background: var(--accent); color: #fff; }
    .timeline-wrap { height: 500px; }
    .timeline-wrap canvas { display: block; width: 100%; height: 100%; }
    .info { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); border-radius: 10px; padding: 14px 18px; font-size: 13px; line-height: 1.6; color: #bbb; margin-bottom: 24px; }
    .info code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📂 Collapsible Groups</h1>
    <p class="subtitle">Click group headers to collapse and expand swimlanes.</p>

    <div class="info">
      Enable with <code>grouping: { collapsible: true }</code>. Click any group label to toggle it. Use <code>collapseGroup()</code>, <code>expandGroup()</code>, and <code>toggleGroup()</code> for programmatic control.
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Engineering Roadmap</h2>
        <div class="spacer"></div>
        <button onclick="collapseAll()">Collapse All</button>
        <button onclick="expandAll()">Expand All</button>
        <button onclick="tl.toggleGroup('Infrastructure'); tl.toggleGroup('Security');">Toggle Infra + Security</button>
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline"></canvas>
      </div>
    </div>
  </div>

  <script>
    var TT = tempis_timeline.TempisTimeline;

    var groups = ['Platform', 'Infrastructure', 'Security', 'Data', 'Mobile', 'DevOps'];

    var items = [
      // Platform
      { id: 1,  label: 'API v3 Migration',       start: '2026-01-12', end: '2026-02-13', grouping: 'Platform',       category: 'feature',  progress: 0.9 },
      { id: 2,  label: 'GraphQL Gateway',         start: '2026-02-02', end: '2026-03-06', grouping: 'Platform',       category: 'feature',  progress: 0.6 },
      { id: 3,  label: 'Rate Limiting',            start: '2026-02-16', end: '2026-03-06', grouping: 'Platform',       category: 'feature',  progress: 0.4 },
      { id: 4,  label: 'SDK Update',              start: '2026-03-09', end: '2026-03-27', grouping: 'Platform',       category: 'planned',  progress: 0 },

      // Infrastructure
      { id: 10, label: 'K8s Cluster Upgrade',     start: '2026-01-19', end: '2026-02-06', grouping: 'Infrastructure', category: 'ops',      progress: 1.0 },
      { id: 11, label: 'CDN Migration',           start: '2026-02-09', end: '2026-02-27', grouping: 'Infrastructure', category: 'ops',      progress: 0.75 },
      { id: 12, label: 'Multi-Region Deploy',     start: '2026-02-23', end: '2026-03-20', grouping: 'Infrastructure', category: 'feature',  progress: 0.3 },
      { id: 13, label: 'Cost Optimisation',       start: '2026-03-16', end: '2026-04-03', grouping: 'Infrastructure', category: 'planned',  progress: 0 },

      // Security
      { id: 20, label: 'SOC2 Audit Prep',         start: '2026-01-05', end: '2026-02-14', grouping: 'Security',       category: 'ops',      progress: 1.0 },
      { id: 21, label: 'Pen Test',                 start: '2026-02-09', end: '2026-02-20', grouping: 'Security',       category: 'ops',      progress: 0.85 },
      { id: 22, label: 'SSO Integration',          start: '2026-02-23', end: '2026-03-13', grouping: 'Security',       category: 'feature',  progress: 0.5 },
      { id: 23, label: 'Secrets Rotation',         start: '2026-03-09', end: '2026-03-20', grouping: 'Security',       category: 'ops',      progress: 0.1 },

      // Data
      { id: 30, label: 'Data Warehouse v2',       start: '2026-01-26', end: '2026-03-06', grouping: 'Data',           category: 'feature',  progress: 0.7 },
      { id: 31, label: 'ETL Pipeline Rewrite',    start: '2026-02-16', end: '2026-03-13', grouping: 'Data',           category: 'feature',  progress: 0.45 },
      { id: 32, label: 'Analytics Dashboard',     start: '2026-03-02', end: '2026-03-27', grouping: 'Data',           category: 'planned',  progress: 0 },

      // Mobile
      { id: 40, label: 'iOS Push Notifications',  start: '2026-01-19', end: '2026-02-06', grouping: 'Mobile',         category: 'feature',  progress: 1.0 },
      { id: 41, label: 'Android Biometrics',      start: '2026-02-02', end: '2026-02-20', grouping: 'Mobile',         category: 'feature',  progress: 0.8 },
      { id: 42, label: 'Offline Mode',            start: '2026-02-23', end: '2026-03-20', grouping: 'Mobile',         category: 'feature',  progress: 0.25 },
      { id: 43, label: 'App Store Release',       start: '2026-03-23', end: '2026-04-03', grouping: 'Mobile',         category: 'planned',  progress: 0 },

      // DevOps
      { id: 50, label: 'CI/CD Pipeline v2',       start: '2026-01-12', end: '2026-02-06', grouping: 'DevOps',         category: 'ops',      progress: 1.0 },
      { id: 51, label: 'Monitoring Overhaul',     start: '2026-02-09', end: '2026-02-27', grouping: 'DevOps',         category: 'ops',      progress: 0.6 },
      { id: 52, label: 'Canary Deployments',      start: '2026-02-23', end: '2026-03-13', grouping: 'DevOps',         category: 'feature',  progress: 0.35 },
      { id: 53, label: 'Disaster Recovery Test',  start: '2026-03-16', end: '2026-03-27', grouping: 'DevOps',         category: 'planned',  progress: 0 },
    ];

    var tl = new TT('#timeline', {
      responsive: true,
      verticalFill: 'fill-canvas',
      style: { item: { borderRadius: 6, fontColor: '#fff', padding: 8 } },
      grouping: { collapsible: true },
      categories: [
        { name: 'feature', label: 'Feature',    style: { backgroundColor: '#6366f1', fontColor: '#fff' } },
        { name: 'ops',     label: 'Operations', style: { backgroundColor: '#0ea5e9', fontColor: '#fff' } },
        { name: 'planned', label: 'Planned',    style: { backgroundColor: '#374151', fontColor: '#9ca3af' } },
      ],
      legend: { position: 'top', markerStyle: 'circle' },
      items: items,
      range: { start: '2026-01-01', end: '2026-04-10', position: 'bottom' }
    });

    function collapseAll() {
      groups.forEach(function(g) { tl.collapseGroup(g); });
    }

    function expandAll() {
      groups.forEach(function(g) { tl.expandGroup(g); });
    }
  </script>
</body>
</html>
