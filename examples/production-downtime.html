<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Operations Console — Tempis Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg:        #f3f5f8;
      --panel:     #ffffff;
      --panel-2:   #f7f9fc;
      --line:      #e4e8ef;
      --line-soft: #eef1f6;
      --text:      #111827;
      --text-dim:  #5b6676;
      --text-mut:  #98a2b3;
      --accent:    #d97706;   /* amber */
      --accent-2:  #0891b2;   /* cyan */
      --good:      #15a46b;
      --warn:      #d97706;
      --bad:       #e5484d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      font-family: Geist, system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .mono {
      font-family: "Geist Mono", ui-monospace, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* ===== Top app bar ===== */
    .appbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand .logo {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #b45309);
      display: grid; place-items: center;
      color: #ffffff; font-weight: 600; font-size: 18px;
      box-shadow: 0 2px 8px rgba(217,119,6,0.25);
    }
    .brand .title { line-height: 1.15; }
    .brand .title .line {
      font-size: 15px; font-weight: 600; letter-spacing: 0.2px;
    }
    .brand .title .sub {
      font-size: 11.5px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1.2px;
    }

    .appbar-spacer { flex: 1; }

    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      font-size: 12.5px;
      color: var(--text-dim);
    }
    .pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(21,164,107,0.18);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    .pill .k { color: var(--text-mut); }
    .pill .v { color: var(--text); font-weight: 500; }

    .clock {
      font-size: 14px; color: var(--text);
      letter-spacing: 0.5px;
    }

    /* ===== Layout ===== */
    .wrap {
      flex: 1;
      min-height: 0;
      padding: 18px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 1700px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== KPI tiles ===== */
    .kpis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .kpi {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px 15px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    }
    .kpi::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent);
      opacity: 0.85;
    }
    .kpi.cyan::before { background: var(--accent-2); }
    .kpi.good::before { background: var(--good); }
    .kpi.bad::before  { background: var(--bad); }
    .kpi .label {
      font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; gap: 6px;
    }
    .kpi .value {
      margin-top: 8px;
      font-size: 28px; font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
    }
    .kpi .value .unit {
      font-size: 14px; color: var(--text-dim); font-weight: 400;
      margin-left: 3px;
    }
    .kpi .foot {
      margin-top: 8px; font-size: 11.5px; color: var(--text-mut);
    }
    .kpi .foot .up   { color: var(--good); }
    .kpi .foot .down { color: var(--bad); }

    /* ===== Main grid ===== */
    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      grid-template-rows: minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--panel-2);
    }
    .panel-head h2 {
      font-size: 13.5px; font-weight: 600; letter-spacing: 0.3px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-head h2 .accent-bar {
      width: 3px; height: 15px; border-radius: 2px; background: var(--accent);
    }
    .panel-head .spacer { flex: 1; }

    .btn {
      font-family: inherit;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      color: var(--text);
      border-color: #cbd2dd;
      background: var(--panel-2);
    }
    .btn.active {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 500;
    }
    .btn.ghost {
      background: transparent;
    }
    .btn-group {
      display: inline-flex;
      gap: 6px;
    }

    /* timeline host — fills the panel; the panel's height is bounded by the
       viewport-height flex chain (body 100vh → wrap → grid → panel), so the
       responsive canvas always has a constrained parent and never runs away. */
    .timeline-host {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    .timeline-host canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ===== Side column ===== */
    .side {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
      min-height: 0;
    }

    /* Side panel fills its grid cell (same height as the timeline panel).
       Its body scrolls internally, so selecting an item never grows the page. */
    .side-panel {
      flex: 1;
      min-height: 0;
    }

    .details-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: #cbd2dd transparent;
    }
    .details-body::-webkit-scrollbar { width: 8px; }
    .details-body::-webkit-scrollbar-thumb { background: #dce1e8; border-radius: 4px; }
    .details-body:hover::-webkit-scrollbar-thumb { background: #cbd2dd; }

    .empty-state {
      height: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-mut);
      gap: 10px;
      padding: 24px;
    }
    .empty-state .ico {
      width: 46px; height: 46px; border-radius: 12px;
      border: 1px dashed #cbd2dd;
      display: grid; place-items: center;
      font-size: 22px; color: var(--text-dim);
    }
    .empty-state .t { font-size: 13.5px; color: var(--text-dim); font-weight: 500; }
    .empty-state .s { font-size: 12px; max-width: 220px; line-height: 1.5; }

    .det-title {
      font-size: 16px; font-weight: 600; margin-bottom: 4px;
    }
    .det-cat {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.3px;
    }
    .det-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .det-cell {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      padding: 10px 12px;
    }
    .det-cell.full { grid-column: 1 / -1; }
    .det-cell .k {
      font-size: 10px; color: var(--text-mut);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .det-cell .v {
      margin-top: 5px; font-size: 13.5px; color: var(--text); line-height: 1.5;
    }
    .det-cell .v.big {
      font-size: 18px; font-weight: 500;
    }
    .sev {
      display: inline-flex; align-items: center; gap: 7px;
      font-weight: 600;
    }
    .sev .dot { width: 9px; height: 9px; border-radius: 50%; }

    /* ===== Causes breakdown ===== */
    .cause-hint {
      font-size: 12px; color: var(--text-mut); line-height: 1.5;
      margin-bottom: 16px;
    }
    .cause-list { display: flex; flex-direction: column; gap: 13px; }
    .cause-row { display: flex; flex-direction: column; gap: 5px; }
    .cause-row .top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    .cause-row .top .nm { color: var(--text); }
    .cause-row .top .ct {
      margin-left: auto; color: var(--text-dim);
      font-size: 12px;
    }
    .cause-row .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .bar {
      height: 6px; border-radius: 4px; background: var(--line-soft); overflow: hidden;
    }
    .bar > span { display: block; height: 100%; border-radius: 4px; }

    @media (max-width: 1100px) {
      /* On narrow screens, stack and allow the page to scroll instead of
         squeezing everything into one viewport height. */
      body { height: auto; min-height: 100vh; overflow: auto; }
      .wrap { min-height: 0; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; flex: none; }
      .timeline-host { height: 460px; flex: none; }
      .side-panel { height: 460px; }
    }
  </style>
</head>
<body>
  <!-- ===== Top app bar ===== -->
  <header class="appbar">
    <div class="brand">
      <div class="logo">⬢</div>
      <div class="title">
        <div class="line">Plant Operations Console</div>
        <div class="sub">Line 3 — Assembly</div>
      </div>
    </div>

    <div class="appbar-spacer"></div>

    <div class="pill">
      <span class="k">Shift</span>
      <span class="v">Day · A-Crew</span>
    </div>
    <div class="pill">
      <span class="dot"></span>
      <span class="v">Monitoring Live</span>
    </div>
    <div class="pill">
      <span class="k">Local</span>
      <span class="v clock mono" id="clock">--:--:--</span>
    </div>
  </header>

  <div class="wrap">
    <!-- ===== KPI tiles ===== -->
    <section class="kpis" id="kpis">
      <div class="kpi good">
        <div class="label">Availability</div>
        <div class="value mono"><span id="kpiAvail">--</span><span class="unit">%</span></div>
        <div class="foot"><span class="up">▲ 1.4%</span> vs. yesterday</div>
      </div>
      <div class="kpi bad">
        <div class="label">Total Downtime</div>
        <div class="value mono"><span id="kpiDowntime">--</span><span class="unit">hrs</span></div>
        <div class="foot"><span id="kpiEvents">--</span> events logged</div>
      </div>
      <div class="kpi">
        <div class="label">MTTR</div>
        <div class="value mono"><span id="kpiMttr">--</span><span class="unit">min</span></div>
        <div class="foot">mean time to repair</div>
      </div>
      <div class="kpi cyan">
        <div class="label">Events Today</div>
        <div class="value mono" id="kpiEvents2">--</div>
        <div class="foot"><span id="kpiHigh">--</span> high severity</div>
      </div>
      <div class="kpi">
        <div class="label">OEE</div>
        <div class="value mono"><span id="kpiOee">--</span><span class="unit">%</span></div>
        <div class="foot"><span class="down">▼ 0.8%</span> vs. target</div>
      </div>
    </section>

    <!-- ===== Main grid ===== -->
    <section class="grid">
      <!-- Timeline panel -->
      <div class="panel">
        <div class="panel-head">
          <h2><span class="accent-bar"></span> Downtime Timeline</h2>
          <div class="spacer"></div>
          <div class="btn-group" id="rangePresets">
            <button class="btn active" data-range="morning">Morning</button>
            <button class="btn" data-range="afternoon">Afternoon</button>
            <button class="btn" data-range="full">Full Shift</button>
          </div>
          <button class="btn ghost" id="clearSelBtn">Clear selection</button>
        </div>
        <div class="timeline-host">
          <canvas id="timeline-canvas"></canvas>
        </div>
      </div>

      <!-- Side column — single panel that swaps between breakdown and event details -->
      <div class="side">
        <div class="panel side-panel">
          <div class="panel-head">
            <h2><span class="accent-bar"></span> <span id="sidePanelTitle">Downtime by Cause</span></h2>
          </div>
          <div class="details-body" id="detailsBody">
            <!-- breakdown / event details injected here -->
          </div>
        </div>
      </div>
    </section>
  </div>

      {

        category: 'material',

        style: { fontColor: '#ffffff' },
        details: {
          cause: 'Adhesive viscosity out of spec due to temperature',

          notes: 'Storage area temperature control being installed.',
          severity: 'Low',

    // ============================================================
    // Shift window / range presets
    // ============================================================
    const SHIFT_START = new Date(2024, 0, 15, 6, 0);
    const SHIFT_END   = new Date(2024, 0, 15, 18, 0);
    const RANGES = {
      morning:   { start: new Date(2024, 0, 15, 6, 0),  end: new Date(2024, 0, 15, 12, 0) },
      afternoon: { start: new Date(2024, 0, 15, 12, 0), end: new Date(2024, 0, 15, 18, 0) },
      full:      { start: SHIFT_START, end: SHIFT_END }
    };

    let timeline = null;
    let selectedEventId = null;

    // DOM refs
    const detailsBody = document.getElementById('detailsBody');

    // ============================================================
    // Timeline init
    // ============================================================
    function initializeTimeline() {
      try {
        if (timeline) timeline.destroy();

        timeline = new tempis_timeline.TempisTimeline('#timeline-canvas', {
          responsive: true,
          verticalFill: 'fill-canvas',
          items: downtimeEvents,
          categories: downtimeCategories,
          selection: 'single',
          style: {
            item: { fontColor: '#ffffff', borderRadius: 5, padding: 8 },
            font: { family: "Geist, system-ui, -apple-system, Roboto, sans-serif", size: 12 }
          },
          legend: {
            position: 'bottom',
            alignment: 'center',
            isFilterOnClick: false
          },
          range: {
            position: 'bottom',
            start: RANGES.morning.start,
            end: RANGES.morning.end,
            zoom: { enabled: true }
          },
          onSelectionChange: handleSelectionChange
        });
      } catch (error) {
        console.error('Error initializing timeline:', error);
      }
    }

    // ============================================================
    // Controlled selection -> detail panel
    // ============================================================
    function handleSelectionChange(changes) {
      const selectedChange = changes.find(c => c.selected === true);
      if (selectedChange) {
        selectedEventId = selectedChange.id;
        timeline.setSelection([selectedEventId]);
        showDetails(selectedEventId);
      } else {
        selectedEventId = null;
        timeline.setSelection([]);
        showEmptyState();
      }
    }

    function clearSelection() {
      selectedEventId = null;
      if (timeline) timeline.setSelection([]);
      showEmptyState();
    }

    // ============================================================
    // Detail panel rendering (carried over faithfully)
    // ============================================================
    function getSeverityColor(severity) {
      switch (severity) {
        case 'High':   return '#ff453a';
        case 'Medium': return '#ff9f0a';
        case 'Low':    return '#30d158';
        default:       return '#9e9e9e';
      }
    }

    // When nothing is selected the side panel shows the downtime-by-cause breakdown.
    function showEmptyState() {
      document.getElementById('sidePanelTitle').textContent = 'Downtime by Cause';
      renderCauses();
      detailsBody.scrollTop = 0;
    }

    function showDetails(eventId) {
      const event = downtimeEvents.find(e => e.id === eventId);
      if (!event) return;

      const category = downtimeCategories.find(c => c.name === event.category);
      const duration = (event.end - event.start) / (1000 * 60); // minutes
      const sevColor = getSeverityColor(event.details.severity);

      document.getElementById('sidePanelTitle').textContent = 'Event Details';

      detailsBody.innerHTML = `
        <div class="det-title">${event.label}</div>
        <span class="det-cat" style="background-color:${category.style.backgroundColor}; color:${category.style.fontColor};">
          ${category.label}
        </span>

        <div class="det-grid">
          <div class="det-cell">
            <div class="k">Machine</div>
            <div class="v">${event.grouping}</div>
          </div>
          <div class="det-cell">
            <div class="k">Duration</div>
            <div class="v mono">${duration.toFixed(0)} min</div>
          </div>
          <div class="det-cell">
            <div class="k">Window</div>
            <div class="v mono">${event.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} – ${event.end.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
          </div>
          <div class="det-cell">
            <div class="k">Severity</div>
            <div class="v"><span class="sev" style="color:${sevColor};"><span class="dot" style="background:${sevColor};"></span>${event.details.severity}</span></div>
          </div>
          <div class="det-cell full">
            <div class="k">Estimated Cost</div>
            <div class="v big mono" style="color:#ff6b6b;">${event.details.cost}</div>
          </div>
          <div class="det-cell full">
            <div class="k">Root Cause</div>
            <div class="v">${event.details.cause}</div>
          </div>
          <div class="det-cell full">
            <div class="k">Resolution</div>
            <div class="v">${event.details.resolution}</div>
          </div>
          <div class="det-cell">
            <div class="k">Recorded By</div>
            <div class="v">${event.details.recordedBy}</div>
          </div>
          <div class="det-cell">
            <div class="k">Event ID</div>
            <div class="v mono">#${String(event.id).padStart(4, '0')}</div>
          </div>
          <div class="det-cell full">
            <div class="k">Notes</div>
            <div class="v">${event.details.notes}</div>
          </div>
        </div>`;

      detailsBody.scrollTop = 0;
    }

    // ============================================================
    // KPI computation (derived from the events data where possible)
    // ============================================================
    function parseCost(str) {
      return Number(String(str).replace(/[^0-9.]/g, '')) || 0;
    }

    function computeKpis() {
      let totalMinutes = 0;
      let highCount = 0;
      downtimeEvents.forEach(e => {
        totalMinutes += (e.end - e.start) / 60000;
        if (e.details.severity === 'High') highCount++;
      });

      const count = downtimeEvents.length;
      const downtimeHrs = totalMinutes / 60;
      const mttr = totalMinutes / count;

      // Availability relative to the shift window per machine (3 machines x 12h)
      const plannedMinutes = 3 * 12 * 60; // 2160
      const availability = Math.max(0, (1 - totalMinutes / plannedMinutes) * 100);
      // Representative performance & quality factors -> OEE
      const performance = 0.94;
      const quality = 0.985;
      const oee = (availability / 100) * performance * quality * 100;

      document.getElementById('kpiAvail').textContent    = availability.toFixed(1);
      document.getElementById('kpiDowntime').textContent = downtimeHrs.toFixed(1);
      document.getElementById('kpiMttr').textContent     = mttr.toFixed(0);
      document.getElementById('kpiEvents').textContent   = count;
      document.getElementById('kpiEvents2').textContent  = count;
      document.getElementById('kpiHigh').textContent     = highCount;
      document.getElementById('kpiOee').textContent      = oee.toFixed(1);
    }

    // ============================================================
    // Downtime-by-cause breakdown
    // ============================================================
    function renderCauses() {
      const totals = {};
      let maxMin = 0;
      downtimeCategories.forEach(c => { totals[c.name] = 0; });
      downtimeEvents.forEach(e => {
        const mins = (e.end - e.start) / 60000;
        totals[e.category] = (totals[e.category] || 0) + mins;
      });

      const rows = downtimeCategories
        .map(c => ({ cat: c, mins: totals[c.name] || 0 }))
        .sort((a, b) => b.mins - a.mins);

      maxMin = Math.max(...rows.map(r => r.mins), 1);

      const rowsHtml = rows.map(r => {
        const pct = (r.mins / maxMin) * 100;
        const hrs = (r.mins / 60).toFixed(1);
        return `
          <div class="cause-row">
            <div class="top">
              <span class="swatch" style="background:${r.cat.style.backgroundColor};"></span>
              <span class="nm">${r.cat.label}</span>
              <span class="ct mono">${hrs}h</span>
            </div>
            <div class="bar"><span style="width:${pct}%; background:${r.cat.style.backgroundColor};"></span></div>
          </div>`;
      }).join('');

      detailsBody.innerHTML = `
        <div class="cause-hint">Total downtime by category across the shift. Select any event on the timeline to view its full details.</div>
        <div class="cause-list">${rowsHtml}</div>`;
    }

    // ============================================================
    // Range presets
    // ============================================================
    function applyRange(key) {
      const r = RANGES[key];
      if (!r || !timeline) return;
      timeline.focus({ range: [r.start, r.end], animate: true, duration: 400 });
    }

    document.getElementById('rangePresets').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-range]');
      if (!btn) return;
      document.querySelectorAll('#rangePresets .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyRange(btn.dataset.range);
    });

    document.getElementById('clearSelBtn').addEventListener('click', clearSelection);

    // ============================================================
    // Live clock
    // ============================================================
    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour12: false });
    }

    // ============================================================
    // Boot
    // ============================================================
    initializeTimeline();
    computeKpis();
    showEmptyState();
    tickClock();
    setInterval(tickClock, 1000);

    window.addEventListener('beforeunload', () => {
      if (timeline) timeline.destroy();
    });
  </script>
