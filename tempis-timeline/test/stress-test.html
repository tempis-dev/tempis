<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stress Test</title>
  <script src="../dist/tempis_timeline.js"></script>
</head>
<style>
  html {
    background-color: #ebebeb;
  }
  .canvas-container {
    width: 100%;
    height: 600px;
    resize: both;
    overflow: hidden;
  }
</style>
<body>
  <div class="canvas-container">
    <canvas id="canvas">
  </div>
</body>
<script>
  function getRandomItem(array) {
    if (!Array.isArray(array) || array.length === 0) {
      throw new Error("Input must be a non-empty array");
    }

    const randomIndex = Math.floor(Math.random() * array.length);
    return array[randomIndex];
  }

  function getRandomDatePeriod(startDate, endDate) {
    const start = startDate.getTime();
    const end = endDate.getTime();

    if (start >= end) {
      throw new Error("startDate must be before endDate");
    }

    // Generate two random timestamps between start and end
    const t1 = start + Math.random() * (end - start);
    const t2 = start + Math.random() * (end - start);

    // Order them so the earlier one comes first
    const randomStart = new Date(Math.min(t1, t2));
    const randomEnd = new Date(Math.max(t1, t2));

    return { start: randomStart, end: randomEnd };
  }

  const minDate = new Date("Jan 23 2025 00:00:00 GMT+0000");
  const maxDate = new Date("Jan 26 2025 00:00:00 GMT+0000");
  const categories = ["Category-1", "Category-2", "Category-3", "Category-4", "Category-5"];
  const groups = ["Group-1", "Group-2", "Group-3", "Group-4", "Group-5"];
  const items = [];

  const itemCount = prompt("Number of items?", 100);

  for (let itemIndex = 0; itemIndex < parseInt(itemCount); itemIndex++) {
    const randomDatePeriod = getRandomDatePeriod(minDate, maxDate);

    items.push({ 
      id: itemIndex,
      label: `Item ${itemIndex}`,
      start: randomDatePeriod.start,
      end: getRandomItem([randomDatePeriod.end, undefined]),
      category: getRandomItem(categories),
      grouping: getRandomItem(groups),
    });
  }

  // Create our timeline options.
  const timelineOptions = {
    responsive: true,
    range: {
      position: "bottom"
    },
    font: {
      size: 14
    },
    categories: [
      {
        name: "Category-1",
        label: "Category 1",
      },
      {
        name: "Category-2",
        label: "Category 2",
      },
      {
        name: "Category-3",
        label: "Category 3",
      },
      {
        name: "Category-4",
        label: "Category 4",
      },
      {
        name: "Category-5",
        label: "Category 5",
      }
    ],
    items
  };

  // Create our timeline and stick a reference to it on the window for easy access.
  window["timeline"] = new tempis_timeline.TempisTimeline("#canvas", timelineOptions);
</script>
</html>
