  <rect x="0" y="0" width="52" height="200" fill="#ffffff"/>
  <rect x="10" y="16" width="32" height="14" rx="4" fill="#eef2ff"/>
  <rect x="10" y="38" width="32" height="14" rx="4" fill="#eef2ff"/>
  <rect x="10" y="60" width="32" height="14" rx="4" fill="#eef2ff"/>
