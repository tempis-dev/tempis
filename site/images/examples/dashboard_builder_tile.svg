  <circle cx="262" cy="82" r="13" fill="none" stroke="#eef0f5" stroke-width="5"/>
  <circle cx="262" cy="82" r="13" fill="none" stroke="#4f46e5" stroke-width="5" stroke-dasharray="48 82" transform="rotate(-90 262 82)"/>
  <!-- bars widget -->
  <rect x="66" y="112" width="110" height="72" rx="8" fill="#ffffff" stroke="#e2e5ee"/>
  <rect x="80" y="150" width="12" height="22" rx="2" fill="#4f46e5"/>
