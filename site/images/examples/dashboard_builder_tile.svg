  <!-- board widgets -->
  <!-- timeline widget -->
  <rect x="66" y="16" width="168" height="86" rx="8" fill="#ffffff" stroke="#e2e5ee"/>
  <rect x="66" y="16" width="168" height="20" rx="8" fill="#ffffff"/>
  <rect x="78" y="23" width="54" height="6" rx="3" fill="#c7cdda"/>
  <rect x="82" y="48" width="44" height="10" rx="3" fill="#4f46e5"/>
  <rect x="118" y="48" width="60" height="10" rx="3" fill="#0ea5e9"/>
